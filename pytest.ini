[pytest]
# Правило владельца (2026-10-30): тесты не запускаются без xdist — всегда параллельно.
addopts = -n 12 -m "not browser"
markers =
    browser: проверки в настоящем браузере, отдельный запуск с -n 2 -m browser
# Тесты модуля лежат в его каталоге (F-23 A); в `tests/` — общие фикстуры, шим форка, проверка структуры
# и сквозные проверки (справка всех входов, канон скиллов и водителей, хуки, документы контура разработки).
testpaths =
    tests
    decisions/tests
    consequences/tests
    viewer/tests
    roots/tests
    runtime/tests
    attack/tests
    cli/tests
    openspec-run/tests
    settings/tests
    step-help/tests
    trace/tests
    anchors/tests
    openspec/schemas/symphysis/tests
# `tests/conftest.py` ставит каталоги модулей в sys.path; `tests` здесь — чтобы тест модуля, запущенный один,
# нашёл его импортом.
pythonpath = tests
