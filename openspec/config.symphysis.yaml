# Образец openspec/config.yaml проекта, который работает по схеме symphysis.
# Установщик копирует его в openspec/config.yaml целевого проекта или сливает с имеющимся.
# Правила коротки: длинное — в instruction схемы. Каждое правило в кавычках: строка с «: » без
# кавычек читается как отображение, и OpenSpec отбрасывает весь список правил артефакта.
schema: symphysis

context: |
  Проект использует схему OpenSpec symphysis.
  Решения живут в журнале decisions.json.
  Улика — путь и дословная цитата из файла.

rules:
  decisions:
    - "у каждого варианта улика — путь и цитата"
    - "маловероятный вариант показывается с причиной"
    - "адресат парковки — материалы, человек, ИБ"
  specs:
    - "предположение помечается словом `предположение` и дорогой `проверить|решить`"
    - "у каждого требования хотя бы один сценарий GIVEN/WHEN/THEN"
  design:
    - "решение излагается, не принимается"
  attack-decisions:
    - "FORCE stance: считай каждое утверждение неподкреплённым, пока улика не доказала обратное"
  attack-artifacts:
    - "FORCE stance: считай каждое утверждение неподкреплённым, пока улика не доказала обратное"
  security:
    - "канон не чеканится в журнал"
