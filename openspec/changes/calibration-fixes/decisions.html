function antipodesOf(id, letter) {
  const out = new Set();
  for (const a of (byId[id].antipodes || [])) if (a.option === letter) out.add(a.other);
  for (const r of JOURNAL.records) for (const a of (r.antipodes || [])) if (a.other === id + '.' + letter) out.add(r.id + '.' + a.option);
  return [...out];
}
function blockedBy(id, letter) { return antipodesOf(id, letter).filter(k => { const [oid, ol] = k.split('.'); return chosen(oid) === ol; }); }
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function evHtml(ev) {
  const loc = ev.line ? ev.path + ':' + ev.line : ev.path;
  const v = ev.found ? '<b class="ok">сверено</b>' : '<b class="bad">не найдено: ' + esc(ev.verdict || '') + '</b>';
  return '<span class="ev">улика: <code>' + esc(loc) + '</code> «' + esc(ev.quote) + '» ' + v + '</span>';
}

/* ---------- схема работы (вертикальная) ---------- */
function renderScheme() {
  const N = Object.fromEntries(NODES.map(n => [n.id, n]));
  const H = 710;
  let svg = '<svg viewBox="0 0 300 ' + H + '"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9aa3b2"/></marker></defs>';
  for (const [f, t, label, side] of EDGES) {
    const a = N[f], b = N[t];
    const ac = a.x + a.w / 2, bc = b.x + b.w / 2;
    let d, lx, ly;
    if (side === 'right') { const p1 = { x:a.x + a.w, y:a.y + a.h / 2 }, p2 = { x:b.x + b.w, y:b.y + b.h / 2 }; const cx = 296;
      d = 'M' + p1.x + ' ' + p1.y + ' C ' + cx + ' ' + p1.y + ', ' + cx + ' ' + p2.y + ', ' + p2.x + ' ' + p2.y; lx = 282; ly = (p1.y + p2.y) / 2; }
    else if (side === 'left') { const p1 = { x:a.x, y:a.y + a.h / 2 }, p2 = { x:b.x, y:b.y + b.h / 2 }; const cx = 4;
      d = 'M' + p1.x + ' ' + p1.y + ' C ' + cx + ' ' + p1.y + ', ' + cx + ' ' + p2.y + ', ' + p2.x + ' ' + p2.y; lx = 18; ly = (p1.y + p2.y) / 2; }
    else { const p1 = { x:ac, y:a.y + a.h }, p2 = { x:bc, y:b.y }; d = 'M' + p1.x + ' ' + p1.y + ' L ' + p2.x + ' ' + p2.y; lx = ac + 6; ly = (p1.y + p2.y) / 2 + 3; }
    svg += '<path class="edge' + (side ? ' loop' : '') + '" d="' + d + '"/>';
    if (label) svg += '<text class="lbl" x="' + lx + '" y="' + ly + '"' + (side === 'right' ? ' text-anchor="middle" transform="rotate(90 ' + lx + ' ' + ly + ')"' : side === 'left' ? ' text-anchor="middle" transform="rotate(-90 ' + lx + ' ' + ly + ')"' : '') + '>' + esc(label) + '</text>';
  }
  for (const n of NODES) {
    const cls = 'node' + (filter.node === n.id ? ' active' : '') + (filter.node && filter.node !== n.id ? ' dim' : '');
    const cx = n.x + n.w / 2, cy = n.y + n.h / 2;
    const shape = n.diamond ? '<polygon points="' + cx + ',' + n.y + ' ' + (n.x + n.w - 40) + ',' + cy + ' ' + cx + ',' + (n.y + n.h) + ' ' + (n.x + 40) + ',' + cy + '"/>'
                            : '<rect x="' + n.x + '" y="' + n.y + '" width="' + n.w + '" height="' + n.h + '" rx="7"/>';
    const cnt = n.d.length ? JOURNAL.records.filter(r => n.d.includes(r.delivery)).length : 0;
    svg += '<g class="' + cls + '" data-node="' + n.id + '">' + shape +
      '<text x="' + cx + '" y="' + (cy - (n.sub ? 2 : -4)) + '" text-anchor="middle">' + esc(n.label) + (cnt ? ' · ' + cnt : '') + '</text>' +
      (n.sub ? '<text class="sub" x="' + cx + '" y="' + (cy + 11) + '" text-anchor="middle">' + esc(n.sub) + '</text>' : '') + '</g>';
  }
  svg += '</svg>';
  const sch = document.getElementById('scheme');
  sch.innerHTML = svg + '<div class="hint">' + (filter.node ? 'фильтр: ' + esc(N[filter.node].label) + ' — клик ещё раз снимает' : (filter.openOnly ? 'только открытые' : 'пунктир — возвраты: новое после второго круга, провал вердикта')) + '</div>';
  sch.querySelectorAll('.node').forEach(g => g.onclick = () => { const n = N[g.dataset.node]; if (!n.d.length) return; filter.node = (filter.node === n.id) ? null : n.id; render(); });
}

function visible(rec) {
  if (filter.node) { const n = NODES.find(p => p.id === filter.node); if (!n.d.includes(rec.delivery)) return false; }
  if (filter.openOnly) { if (rec.kind === 'факт' || chosen(rec.id)) return false; }
  return true;
}

/* ---------- карточки ---------- */
function renderCards() {
  const el = document.getElementById('cards');
  el.innerHTML = JOURNAL.records.filter(visible).map(rec => {
    const d = dec(rec.id);
    const isFact = rec.kind === 'факт';
    const jc = journalChoice(rec);
    const localChoice = d.choice;
    const changed = !!(localChoice && jc && localChoice !== jc);
    const jpark = (rec.parking || []).map(p => ({ text:p.text, addressee:p.addressee, journal:true }));
    const parkedAll = jpark.concat(d.parked || []);
    const cls = ['card', isFact ? 'fact' : '', changed ? 'changed' : (chosen(rec.id) ? 'decided' : ''), parkedAll.length ? 'parked' : ''].join(' ');
    let status = isFact ? '<span class="badge fact">факт · закрыт уликами</span>'
      : changed ? '<span class="badge changed">изменено: ' + esc(jc) + ' → ' + esc(localChoice) + '</span>'
      : localChoice ? '<span class="badge ok">решено здесь: ' + esc(localChoice) + '</span>'
      : jc ? '<span class="badge ok">решено в журнале: ' + esc(jc) + '</span>' : '<span class="badge">открыто</span>';
    if (parkedAll.length) status += '<span class="badge park">парковка: ' + parkedAll.length + '</span>';
    const deps = effectiveDeps(rec);
    const waiting = deps.filter(x => x.kind !== 'removed' && !chosen(x.id)).map(x => x.id);
    let html = '<div class="' + cls + '" id="' + rec.id + '"><div class="head"><span class="id mono">' + rec.id + '</span>' + status +
      '<span class="badge">' + esc(rec.delivery || '—') + '</span>' + (rec.addressee ? '<span class="badge">адресат: ' + esc(rec.addressee) + '</span>' : '') + '</div>' +
      '<div class="q">' + esc(rec.question) + '</div>';
    html += '<div class="meta">зависит от: ' + (deps.length ? deps.map(x => '<span class="chip ' + x.kind + '"><a href="#' + x.id + '">' + x.id + '</a>' +
      (x.kind === 'removed' ? '<button data-undep="' + rec.id + '|' + x.id + '" title="вернуть">↺</button>' : '<button data-rmdep="' + rec.id + '|' + x.id + '" title="снять зависимость">×</button>') + '</span>').join('') : '—') +
      '<input type="text" data-deptext="' + rec.id + '" placeholder="F-NN" title="добавить зависимость"><button class="small" data-adddep="' + rec.id + '">+ зависимость</button></div>';
    if (waiting.length) html += '<div class="note warn">предпосылка не решена: ' + waiting.join(', ') + ' — выбирать можно, но ответ до неё — догадка</div>';
    if (rec.evidence && rec.evidence.length && !isFact) html += '<div class="note info"><b>улики записи</b>' + rec.evidence.map(evHtml).join('') + '</div>';
    if (rec.finding) html += '<div class="note info"><b>находка:</b> ' + esc(rec.finding) + '</div>';
    if (isFact) {
      html += rec.evidence.map(evHtml).join('');
      if (rec.dispute) html += '<div class="note park"><b>спор в журнале:</b> ' + esc(rec.dispute) + '</div>';
      html += '<div class="cons">следствия: ' + esc(rec.consequences || '—') + '</div>';
      html += '<div class="row"><textarea data-dispute="' + rec.id + '" placeholder="оспорить факт: что не так и чем это подтверждается">' + esc(state.disputes[rec.id] || '') + '</textarea></div>';
    } else {
      const cur = chosen(rec.id);
      for (const o of allOptions(rec)) {
        const blocked = blockedBy(rec.id, o.letter);
        const anti = antipodesOf(rec.id, o.letter);
        const tags = (rec.recommendation && rec.recommendation.option === o.letter ? '<span class="tag rec">рекомендация</span>' : '') +
          (jc === o.letter ? '<span class="tag journal">в журнале</span>' : '') +
          (o.unlikely ? '<span class="tag unlikely" title="' + esc(o.unlikely) + '">маловероятно</span>' : '') +
          (o.added ? '<span class="tag added">добавлен человеком</span>' : '') +
          (anti.length ? '<span class="tag anti" title="нельзя вместе с: ' + esc(anti.join(', ')) + '">антипод ' + esc(anti.join(', ')) + '</span>' : '');
        html += '<label class="opt' + (cur === o.letter ? ' chosen' : '') + (blocked.length ? ' blocked' : '') + '">' +
          '<input type="radio" name="' + rec.id + '" value="' + o.letter + '"' + (cur === o.letter ? ' checked' : '') + '>' +
          '<div class="t"><span class="letter">' + o.letter + '.</span> ' + esc(o.text) + tags +
          (o.unlikely ? '<span class="ev">маловероятно: ' + esc(o.unlikely) + '</span>' : '') +
          (o.evidence || []).map(evHtml).join('') + '</div></label>';
      }
      if (rec.recommendation) html += '<div class="rec">рекомендация: <b>' + esc(rec.recommendation.option) + '</b> — ' + esc(rec.recommendation.why) + '</div>';
      if (rec.decision && rec.decision.word) html += '<div class="note info"><b>слово в журнале (' + esc(rec.decision.date || '') + '):</b> «' + esc(rec.decision.word) + '»</div>';
      html += '<div class="note bad hidden" data-msg="' + rec.id + '"></div>';
      html += '<div class="row"><textarea data-word="' + rec.id + '" placeholder="слово человека дословно — почему так (или что изменить в решении из журнала)">' + esc(d.word || '') + '</textarea></div>';
      html += '<div class="row"><input type="text" data-addtext="' + rec.id + '" placeholder="вариант, которого здесь нет"><button class="small" data-addopt="' + rec.id + '">добавить вариант</button></div>';
      html += '<details class="park"' + (parkedAll.length ? ' open' : '') + '><summary title="' + esc(PARK_HINT) + '">парковка — дополнительный вопрос с адресатом (' + parkedAll.length + ')</summary>' +
        '<div class="note park" style="margin:6px 0">' + esc(PARK_HINT) + '</div>' +
        parkedAll.map((p, i) => '<div class="parkitem"><span class="who">→ ' + esc(p.addressee || '?') + (p.journal ? ' · в журнале' : '') + '</span><span>' + esc(p.text || '(без текста)') + '</span>' +
          (p.journal ? '' : '<button class="small" data-unpark="' + rec.id + '|' + (i - jpark.length) + '">снять</button>') + '</div>').join('') +
        '<div class="row"><input type="text" data-parktext="' + rec.id + '" placeholder="что именно надо узнать или решить отдельно">' +
        '<select data-addressee="' + rec.id + '" title="' + esc(PARK_HINT) + '">' + ADDRESSEES.map(a => '<option>' + a + '</option>').join('') + '</select>' +
        '<button class="small" data-park="' + rec.id + '">припарковать</button></div></details>';
      html += '<div class="cons">следствия: ' + esc(rec.consequences || '—') + '</div>';
    }
    return html + '</div>';
  }).join('');

  el.querySelectorAll('input[type=radio]').forEach(r => r.onchange = () => {
    const id = r.name, letter = r.value, blocked = blockedBy(id, letter);
    if (blocked.length) {
      r.checked = false;
      const m = el.querySelector('[data-msg="' + id + '"]');
      m.textContent = 'антипод уже выбран: ' + blocked.join(', ') + ' — сначала измени то решение';
      m.classList.remove('hidden');
      return;
    }
    const d = dec(id); d.choice = (letter === journalChoice(byId[id])) ? null : letter; save(); render();
  });
  el.querySelectorAll('textarea[data-word]').forEach(t => t.oninput = () => { dec(t.dataset.word).word = t.value; save(); updateOut(); });
  el.querySelectorAll('textarea[data-dispute]').forEach(t => t.oninput = () => { state.disputes[t.dataset.dispute] = t.value; save(); updateOut(); });
  el.querySelectorAll('button[data-addopt]').forEach(b => b.onclick = () => {
    const id = b.dataset.addopt, inp = el.querySelector('input[data-addtext="' + id + '"]');
    const text = (inp.value || '').trim(); if (!text) return;
    const letters = allOptions(byId[id]).map(o => o.letter);
    const next = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').find(l => !letters.includes(l));
    (state.added[id] = state.added[id] || []).push({ letter: next, text }); save(); render();
  });
  el.querySelectorAll('button[data-park]').forEach(b => b.onclick = () => {
    const id = b.dataset.park, text = (el.querySelector('input[data-parktext="' + id + '"]').value || '').trim();
    const addressee = el.querySelector('select[data-addressee="' + id + '"]').value;
    if (!text) { const m = el.querySelector('[data-msg="' + id + '"]'); m.textContent = 'парковка без вопроса — нечего адресовать'; m.classList.remove('hidden'); return; }
    dec(id).parked.push({ text, addressee }); save(); render();
  });
  el.querySelectorAll('button[data-unpark]').forEach(b => b.onclick = () => { const [id, i] = b.dataset.unpark.split('|'); dec(id).parked.splice(+i, 1); save(); render(); });
  el.querySelectorAll('button[data-adddep]').forEach(b => b.onclick = () => {
    const id = b.dataset.adddep, inp = el.querySelector('input[data-deptext="' + id + '"]');
    const dep = (inp.value || '').trim().toUpperCase().replace(/^F(\d)/, 'F-$1');
    const m = el.querySelector('[data-msg="' + id + '"]');
    if (!byId[dep]) { m.textContent = 'нет записи ' + dep; m.classList.remove('hidden'); return; }
    if (dep === id) { m.textContent = 'запись не может зависеть от себя'; m.classList.remove('hidden'); return; }
    const u = state.deps[id] = state.deps[id] || { add:[], remove:[] };
    if (byId[id].depends_on.includes(dep)) { u.remove = u.remove.filter(x => x !== dep); }
    else if (!u.add.includes(dep)) u.add.push(dep);
    save(); render();
  });
  el.querySelectorAll('button[data-rmdep]').forEach(b => b.onclick = () => {
    const [id, dep] = b.dataset.rmdep.split('|');
    const u = state.deps[id] = state.deps[id] || { add:[], remove:[] };
    if (u.add.includes(dep)) u.add = u.add.filter(x => x !== dep); else if (!u.remove.includes(dep)) u.remove.push(dep);
    save(); render();
  });
  el.querySelectorAll('button[data-undep]').forEach(b => b.onclick = () => {
    const [id, dep] = b.dataset.undep.split('|');
    const u = state.deps[id]; if (u) u.remove = u.remove.filter(x => x !== dep); save(); render();
  });
}

function renderNewForks() {
  document.getElementById('newForks').innerHTML = state.newForks.map((f, i) =>
    '<div class="card" style="margin-top:8px"><div class="head"><span class="id mono">' + f.id + '</span><span class="badge added">добавлена человеком</span>' +
    '<button class="small" data-delfork="' + i + '" style="margin-left:auto">убрать</button></div><div class="q">' + esc(f.question) + '</div>' +
    '<div class="meta">варианты: ' + esc(f.options.replace(/\n+/g, ' · ')) + '</div><div class="cons">' + esc(f.word) + '</div></div>').join('');
  document.querySelectorAll('button[data-delfork]').forEach(b => b.onclick = () => { state.newForks.splice(+b.dataset.delfork, 1); save(); render(); });

function renderToc() {
  document.getElementById('toc').innerHTML = JOURNAL.records.map(rec => {
    const d = state.decisions[rec.id];
    const jc = journalChoice(rec);
    const dot = rec.kind === 'факт' ? 'fact' : (d && d.choice && jc && d.choice !== jc) ? 'changed' : chosen(rec.id) ? 'ok' : (((rec.parking && rec.parking.length) || (d && d.parked && d.parked.length)) ? 'park' : '');
    return '<a href="#' + rec.id + '"><span class="dot ' + dot + '"></span><span class="id">' + rec.id + '</span><span class="q" title="' + esc(rec.question) + '">' + esc(rec.question) + '</span></a>';
  }).join('');
}

function renderStats() {
  const forks = JOURNAL.records.filter(r => r.kind !== 'факт');
  const decided = forks.filter(r => chosen(r.id)).length;
  const changed = forks.filter(r => { const d = state.decisions[r.id]; const jc = journalChoice(r); return d && d.choice && jc && d.choice !== jc; }).length;
  const parked = forks.filter(r => (r.parking && r.parking.length) || (state.decisions[r.id] && state.decisions[r.id].parked.length)).length;
  const disputed = Object.values(state.disputes).filter(v => v && v.trim()).length;
  document.getElementById('stats').innerHTML =
    'развилок <b>' + forks.length + '</b> · решено <b>' + decided + '</b>' + (changed ? ' · изменено здесь <b>' + changed + '</b>' : '') +
    ' · открыто <b>' + (forks.length - decided) + '</b> · с парковкой <b>' + parked + '</b> · фактов <b>' + (JOURNAL.records.length - forks.length) + '</b>' +
    (disputed ? ' · оспорено <b>' + disputed + '</b>' : '') + (state.newForks.length ? ' · добавлено развилок <b>' + state.newForks.length + '</b>' : '');
  const s = JOURNAL.stats || {};
  document.getElementById('evstats').textContent = 'улик сверено ' + (s.evidence_found ?? '?') + ' из ' + (s.evidence_total ?? '?') + ' · собрано ' + (JOURNAL.generated || '');
}

function updateOut() {
  const lines = ['Решения по журналу ' + (JOURNAL.source || '') + ', ' + new Date().toISOString().slice(0, 10) + ':'];
  for (const rec of JOURNAL.records) {
    const d = state.decisions[rec.id];
    if (rec.kind === 'факт') { const sp = (state.disputes[rec.id] || '').trim(); if (sp) lines.push('- ' + rec.id + ': факт оспорен — «' + sp + '»'); continue; }
    for (const o of (state.added[rec.id] || [])) lines.push('- ' + rec.id + ': добавлен вариант ' + o.letter + '. ' + o.text);
    const u = state.deps[rec.id];
    if (u) { for (const x of u.add) lines.push('- ' + rec.id + ': зависимость добавлена ' + x); for (const x of u.remove) lines.push('- ' + rec.id + ': зависимость снята ' + x); }
    if (!d) continue;
    const w = (d.word || '').trim(), jc = journalChoice(rec);
    for (const p of (d.parked || [])) lines.push('- ' + rec.id + ': припарковано → ' + p.addressee + ' — «' + p.text + '»');
    if (d.choice && d.choice !== jc) lines.push('- ' + rec.id + ': ' + d.choice + (jc ? ' (было ' + jc + ')' : '') + (w ? ' — «' + w + '»' : ' — (без слова)'));
    else if (w) lines.push('- ' + rec.id + ': ' + (jc ? 'к решению ' + jc : 'без выбора') + ' — «' + w + '»');
  }
  if (state.newForks.length) { lines.push('Новые развилки:'); for (const f of state.newForks) lines.push('- ' + f.id + ': ' + f.question + ' — варианты: ' + f.options.replace(/\n+/g, ' | ') + (f.word ? ' — «' + f.word + '»' : '')); }
  /* споры по строкам атаки — в тот же блок «Замечания к схеме:», замечания режима 1 первыми; грамматика apply даёт один notes[] на блок,
     поэтому всё склеивается в одну строку через « · » */
  const disputes = [];
  for (const att of ATTACK) for (const r of (att.rows || [])) {
    const sp = (attackState.disputes[disputeKey(att, r)] || '').replace(/\s+/g, ' ').trim();
    if (sp) disputes.push('атака ' + att.path + ' · ' + r.lens + ' · «' + short(r.claim, 60) + '» — спор: ' + sp);
  }
  const notes = [(state.notes || '').trim()].concat(disputes).filter(Boolean);
  if (notes.length) lines.push('Замечания к схеме: ' + notes.join(' · '));
  if (lines.length === 1) lines.push('(нового нет — решения из журнала остаются как есть, молчание по открытой развилке оставляет её открытой)');
  document.getElementById('out').value = lines.join('\n');
}

/* ---------- режимы: переключатель в шапке, видимость панелей ---------- */

  const el = document.getElementById('modes');
  const rows = ATTACK.reduce((n, a) => n + (a.rows || []).length, 0);
  el.innerHTML = MODES.map(m => '<button class="small' + (mode === m ? ' active' : '') + '" data-mode="' + m + '">' + MODE_LABELS[m] + (m === 'attack' && rows ? ' · ' + rows : '') + '</button>').join('');
  el.querySelectorAll('button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
  document.getElementById('viewDecisions').classList.toggle('hidden', mode !== 'decisions');
  document.getElementById('viewCheck').classList.toggle('hidden', mode !== 'check');
  document.getElementById('viewAttack').classList.toggle('hidden', mode !== 'attack');
  document.getElementById('outpanel').classList.toggle('hidden', mode === 'check');   /* проверка ничего не возвращает */
}

/* ---------- общее для режимов 2 и 3 ---------- */
function isProbe(rec) { return !!(rec.outcome && rec.outcome.kind === 'проба'); }
function isAdded(o) { return !!o.added || String(o.text || '').includes(ADDED_MARK); }
function isOneWay(rec) { return !!(rec.reversibility && rec.reversibility.level === ONE_WAY); }
function num(id) { return parseInt(String(id).slice(2), 10) || 0; }
function allEvidence(rec) { return (rec.evidence || []).concat(...(rec.options || []).map(o => o.evidence || [])); }
function short(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
function shaChip(sha, missing) { return sha ? '<code title="' + esc(sha) + '">' + esc(sha.slice(0, 12)) + '</code>' : '<span class="mute">' + esc(missing) + '</span>'; }
function journalTarget(att) { return ((att.frontmatter || {}).targets || []).find(t => t.path === 'decisions.json'); }
/* сверка хеша цели decisions.json из frontmatter атаки с хешем файла журнала, который встроил render-html (ключ sha256) */
function verdictNote(att) {
  const t = journalTarget(att);
  if (!t || !JOURNAL.sha256) return '';
  if (!t.sha256) return '<span class="badge warn">хеш журнала в атаке не записан</span>';
  return t.sha256 === JOURNAL.sha256 ? '<span class="badge ok">хеш журнала совпал</span>' : '<span class="badge bad">вердикт устарел: журнал изменён после атаки</span>';
}

/* ---------- режим 2 — проверка: снимок решений перед proposal, только чтение ---------- */
/* проекция «куда уйдёт» — зеркало render_design (tools/journal_render.py): решённая развилка, не проба → Decisions
   («в одну сторону» — первыми); проба Specify* → spec.md; Backstop → тест-страховка в tasks.md, в design.md её нет;
   Dismiss → никуда, с причиной; Defer и открытая развилка → Open Questions; факт → Context, спорный — ещё и Open Questions */
function destination(rec) {
  if (rec.kind === 'факт') return { label:'design.md › Context', note: (rec.dispute || '').trim() ? 'спор → design.md › Open Questions' : '' };
  if (isProbe(rec)) {
    const v = String(rec.outcome.value || ''), reason = (rec.outcome.reason || '').trim();
    if (v.startsWith('Specify')) return { label:'spec.md', note:'исход ' + v };
    if (v === 'Backstop') return { label:'tasks.md › тест-страховка', note:'в design.md не попадает' };
    if (v === 'Dismiss') return { label:'никуда', note: reason ? 'причина: ' + reason : 'причина не записана' };
    if (v === 'Defer') return { label:'design.md › Open Questions', note:'отложена (Defer)' };
    return { label:'никуда', note:'исход «' + v + '» вне четырёх' };
  }
  if (rec.decision && rec.decision.option) return { label:'design.md › Decisions', note: isOneWay(rec) ? 'в одну сторону — первой' : '' };
  return { label:'design.md › Open Questions', note:'открыта' };
}
/* парковки: render_design кладёт каждую в Open Questions; адресат говорит, где ищется ответ */
function parkingDestination(addressee) { return 'design.md › Open Questions → ' + ({ 'ИБ':'security.md', 'материалы':'research/', 'человек':'вопрос человеку' }[addressee] || '—'); }

function checkCard(rec) {
  const d = destination(rec), isFact = rec.kind === 'факт';
  const picked = rec.decision && rec.decision.option ? (rec.options || []).find(o => o.letter === rec.decision.option) : null;
  let html = '<div class="card' + (isFact ? ' fact' : picked ? ' decided' : '') + '"><div class="head"><span class="id mono">' + rec.id + '</span>' +
    '<span class="badge">' + esc(rec.kind) + ' · ' + esc(rec.status) + '</span><span class="badge">' + esc(rec.delivery || '—') + '</span>' +
    (isOneWay(rec) ? '<span class="badge warn">в одну сторону</span>' : '') +
    '<span class="badge dest" title="куда уйдёт — по правилам render-design">→ ' + esc(d.label) + (d.note ? ' · ' + esc(d.note) : '') + '</span></div>' +
    '<div class="q">' + esc(rec.question) + '</div>';
  if (picked) html += '<div class="opt chosen"><span class="letter">' + picked.letter + '.</span><div>' + esc(picked.text) + (isAdded(picked) ? '<span class="tag added">добавлен человеком</span>' : '') + '</div></div>';
  if (rec.decision && rec.decision.word) html += '<div class="note info"><b>слово (' + esc(rec.decision.date || 'без даты') + '):</b> «' + esc(rec.decision.word) + '»</div>';
  if (rec.reversibility) html += '<div class="meta">обратимость: ' + esc(rec.reversibility.level) + (rec.reversibility.why ? ' — ' + esc(rec.reversibility.why) : '') + '</div>';
  if (rec.outcome) html += '<div class="meta">исход: ' + esc(rec.outcome.kind) + ' — <b>' + esc(rec.outcome.value) + '</b>' + (rec.outcome.reason ? ' — ' + esc(rec.outcome.reason) : '') + '</div>';
  if (!picked && !isFact) {
    html += (rec.options || []).map(o => '<div class="opt"><span class="letter">' + o.letter + '.</span><div>' + esc(o.text) +
      (o.unlikely ? '<span class="tag unlikely">маловероятно: ' + esc(o.unlikely) + '</span>' : '') + (isAdded(o) ? '<span class="tag added">добавлен человеком</span>' : '') + '</div></div>').join('');
    if (rec.recommendation) html += '<div class="rec">рекомендация: <b>' + esc(rec.recommendation.option || '') + '</b> — ' + esc(rec.recommendation.why || rec.recommendation.text || '') + '</div>';
  } else if (picked) {
    const added = (rec.options || []).filter(o => isAdded(o) && o.letter !== picked.letter);
    if (added.length) html += '<div class="meta">добавлены человеком: ' + esc(added.map(o => o.letter + '. ' + o.text).join('; ')) + '</div>';
  }
  if (isFact) {
    html += (rec.evidence || []).map(evHtml).join('');
    html += (rec.dispute || '').trim() ? '<div class="note park"><b>спор:</b> ' + esc(rec.dispute) + '</div>' : '<div class="meta">спора нет</div>';
  }
  if (rec.consequences) html += '<div class="cons">следствия: ' + esc(rec.consequences) + '</div>';
  return html + '</div>';
}

function renderCheck() {
  const recs = JOURNAL.records, forks = recs.filter(r => r.kind === 'развилка');
  const decidedAll = forks.filter(r => r.decision && r.decision.option);
  const decided = decidedAll.filter(r => !isProbe(r)), probes = recs.filter(isProbe);
  const open = forks.filter(r => !(r.decision && r.decision.option)), facts = recs.filter(r => r.kind === 'факт');
  const parkings = recs.flatMap(r => (r.parking || []).map(p => Object.assign({ rec:r.id }, p)));
  const snapshot = ATTACK.find(journalTarget);
  let html = '<div class="card"><div class="head"><span class="id mono">снимок</span><span class="badge">' + esc(JOURNAL.source || '') + '</span>' +
    '<span class="badge">sha256 журнала: ' + shaChip(JOURNAL.sha256, 'не подан — рендер не из файла') + '</span>' +
    (snapshot ? '<span class="badge ' + (snapshot.frontmatter.status === 'passed' ? 'ok' : 'park') + '">атака: ' + esc(snapshot.frontmatter.status || '—') + '</span>' + verdictNote(snapshot)
              : '<span class="badge">атака не подана</span>') +
    '</div><div class="q">' + esc(JOURNAL.title || '') + '</div>' +
    '<div class="meta">только чтение: режим ничего не пишет и вердиктом не считается — снимок решений перед proposal и spec.md; «→» у записи — куда она уйдёт по правилам render-design</div></div>';
  html += '<div class="counters">решено <b>' + decidedAll.length + '</b> · открыто <b>' + open.length + '</b> · припарковано: ' +
    ADDRESSEES.map(a => a + ' <b>' + parkings.filter(p => p.addressee === a).length + '</b>').join(' / ') +
    ' · фактов оспорено <b>' + facts.filter(r => (r.dispute || '').trim()).length + '</b>' +
    ' · улик не найдено <b>' + recs.flatMap(allEvidence).filter(ev => ev.found === false).length + '</b></div>';
  const dates = [...new Set(decided.map(r => r.decision.date || ''))].sort((a, b) => a < b ? 1 : a > b ? -1 : 0);
  html += '<h2>Решено — по дате решения · ' + decided.length + '</h2>' + (dates.length ? '' : '<div class="meta">—</div>');
  for (const date of dates) {
    const group = decided.filter(r => (r.decision.date || '') === date).sort((a, b) => (isOneWay(b) - isOneWay(a)) || (num(a.id) - num(b.id)));
    html += '<h3>' + (date ? esc(date) : 'без даты') + ' · ' + group.length + '</h3>' + group.map(checkCard).join('');
  }
  const section = (title, list) => '<h2>' + title + ' · ' + list.length + '</h2>' + (list.length ? list.map(checkCard).join('') : '<div class="meta">—</div>');
  html += section('Открытые развилки — с рекомендацией', open) + section('Пробы — с исходом', probes) + section('Факты — улики и спор', facts);
  html += '<h2>Парковки — по адресатам · ' + parkings.length + '</h2>' + (parkings.length ? '' : '<div class="meta">—</div>');
  for (const a of ADDRESSEES) {
    const ps = parkings.filter(p => p.addressee === a); if (!ps.length) continue;
    html += '<h3>→ ' + a + ' · ' + ps.length + ' <span class="badge dest">' + esc(parkingDestination(a)) + '</span></h3>' +
      ps.map(p => '<div class="parkitem"><span class="who mono">' + p.rec + '</span><span>' + esc(p.text) + (p.finding ? ' — <b>находка:</b> ' + esc(p.finding) : '') + '</span></div>').join('');
  }
  const notes = JOURNAL.notes || [];
  html += '<h2>Заметки · ' + notes.length + '</h2>' + (notes.length ? '<ul>' + notes.map(n => '<li><span class="mono">' + esc(n.date) + '</span> — ' + esc(n.text) + '</li>').join('') + '</ul>' : '<div class="meta">—</div>');
  document.getElementById('viewCheck').innerHTML = html;
}

/* ---------- режим 3 — атака: строки attack/*.md, линза → тяжесть → строки ---------- */
function lensLabel(slug) { const l = LENSES.find(x => x.slug === slug); return l ? l.label : ''; }
function sevClass(s) { return s === 'блокер' ? 'bad' : s === 'предупреждение' ? 'warn' : s === 'справка' ? '' : 'park'; }
/* раздел вида `F-NN, поле` с записью в журнале — переход к карточке в режиме 1, не слияние сущностей */
function sectionHtml(section) {
  const m = /^(F-\d+)/.exec(String(section || ''));
  if (m && byId[m[1]]) return '<a href="#' + m[1] + '" data-goto="' + m[1] + '" title="к записи ' + m[1] + ' в режиме «решения»">' + esc(section) + '</a>';
  return esc(section);
}
function attackRow(att, r) {
  const key = disputeKey(att, r), known = LENSES.some(l => l.slug === r.lens);
  return '<div class="card"><div class="head"><span class="badge ' + sevClass(r.severity) + '">' + esc(r.severity) + '</span><span class="badge">' + sectionHtml(r.section) + '</span>' +
    (known ? '' : '<span class="badge bad">линза «' + esc(r.lens) + '» вне списка — строка невалидна</span>') + '</div>' +
    '<div class="q">' + esc(r.claim) + '</div>' +
    '<div class="meta">инвариант: ' + esc(r.invariant) + '</div><div class="meta">опора: ' + esc(r.support) + '</div><div class="meta">чем закрыть: ' + esc(r.fix) + '</div>' +
    '<div class="row"><textarea data-dispute-key="' + esc(key) + '" placeholder="спор: почему опора есть / почему не блокер — уйдёт в промпт возврата">' + esc(attackState.disputes[key] || '') + '</textarea></div></div>';
}
function renderAttack() {
  const el = document.getElementById('viewAttack');
  if (!ATTACK.length) { el.innerHTML = '<div class="card"><div class="q">атака не подана: <code>render-html --attack &lt;attack/decisions.md&gt; [--attack &lt;attack/artifacts.md&gt;]</code></div></div>'; return; }
  const slugs = LENSES.map(l => l.slug);
  let html = '<div class="note info">' + esc(ATTACK_HINT) + '</div>';
  for (const att of ATTACK) {
    const fm = att.frontmatter || {}, rows = att.rows || [];
    const outside = rows.filter(r => !slugs.includes(r.lens));
    html += '<div class="card"><div class="head"><span class="id mono">' + esc(att.path) + '</span><span class="badge ' + (fm.status === 'passed' ? 'ok' : 'park') + '">status: ' + esc(fm.status || '—') + '</span>' + verdictNote(att) + '</div>' +
      '<div class="meta">цели: ' + (fm.targets || []).map(t => '<span class="chip">' + esc(t.path) + ' ' + shaChip(t.sha256, 'без хеша') + '</span>').join('') + '</div>' +
      '<div class="counters">по тяжести: ' + SEVERITY.map(s => s + ' <b>' + rows.filter(r => r.severity === s).length + '</b>').join(' · ') + '</div>' +
      '<div class="counters">по линзе: ' + slugs.map(s => [s, rows.filter(r => r.lens === s).length]).filter(x => x[1]).map(x => '<code>' + x[0] + '</code> <b>' + x[1] + '</b>').join(' · ') +
      (outside.length ? ' · вне списка <b>' + outside.length + '</b>' : '') + '</div></div>';
    const groups = slugs.map(s => [s, rows.filter(r => r.lens === s)]).filter(g => g[1].length);
    if (outside.length) groups.push([null, outside]);
    for (const [slug, rs] of groups) {
      html += '<h2>' + (slug ? '<code>' + slug + '</code> · ' + esc(lensLabel(slug)) : 'вне списка — слуг не из закрытого списка линз') + ' · ' + rs.length + '</h2>';
      const sevs = SEVERITY.concat([...new Set(rs.map(r => r.severity))].filter(s => !SEVERITY.includes(s)));
      for (const sev of sevs) { const part = rs.filter(r => r.severity === sev); if (part.length) html += '<h3>' + esc(sev) + ' · ' + part.length + '</h3>' + part.map(r => attackRow(att, r)).join(''); }
    }
  }
  el.innerHTML = html;
  el.querySelectorAll('textarea[data-dispute-key]').forEach(t => t.oninput = () => { const k = t.dataset.disputeKey; if (t.value.trim()) attackState.disputes[k] = t.value; else delete attackState.disputes[k]; saveAttack(); updateOut(); });
  el.querySelectorAll('a[data-goto]').forEach(a => a.onclick = e => { e.preventDefault(); setMode('decisions'); const c = document.getElementById(a.dataset.goto); if (c && c.scrollIntoView) c.scrollIntoView(); });
}

function render() { renderModes(); renderScheme(); renderCards(); renderNewForks(); renderToc(); renderStats(); if (mode === 'check') renderCheck(); if (mode === 'attack') renderAttack(); updateOut(); }

document.getElementById('notes').value = state.notes || '';
document.getElementById('notes').oninput = e => { state.notes = e.target.value; save(); updateOut(); };
document.getElementById('btnAll').onclick = () => { filter = { node:null, openOnly:false }; render(); };
document.getElementById('btnOpen').onclick = () => { filter.openOnly = !filter.openOnly; render(); };
document.getElementById('btnToggleNew').onclick = () => document.getElementById('newForkForm').classList.toggle('hidden');
document.getElementById('btnAddFork').onclick = () => {
  const q = document.getElementById('nfQuestion').value.trim(); if (!q) return;
  state.newForks.push({ id: 'F-N' + (state.newForks.length + 1), question: q, options: document.getElementById('nfOptions').value.trim(), word: document.getElementById('nfWord').value.trim() });
  ['nfQuestion','nfOptions','nfWord'].forEach(i => document.getElementById(i).value = ''); save(); render();
};
document.getElementById('btnCopy').onclick = async () => {
  const t = document.getElementById('out'); let ok = false;
  try { await navigator.clipboard.writeText(t.value); ok = true; } catch (e) { t.select(); ok = document.execCommand('copy'); }
  const c = document.getElementById('copied'); c.textContent = ok ? 'скопировано' : 'не удалось — выдели и скопируй руками'; setTimeout(() => c.textContent = '', 2000);
};
document.getElementById('btnExport').onclick = () => {
  const blob = new Blob([JSON.stringify(state, null, 1)], { type:'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'symphysis-decisions.json'; a.click();
};
document.getElementById('btnImport').onclick = () => document.getElementById('fileImport').click();
document.getElementById('fileImport').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(txt => { try { state = Object.assign(EMPTY(), JSON.parse(txt)); save(); render(); document.getElementById('notes').value = state.notes || ''; } catch (err) { alert('не JSON состояния'); } });
};
document.getElementById('btnReset').onclick = () => { if (confirm('Стереть все решения и споры из браузера? Решения, уже внесённые в журнал, останутся.')) { state = EMPTY(); save(); attackState = { disputes:{} }; saveAttack(); document.getElementById('notes').value = ''; render(); } };
document.getElementById('title').textContent = JOURNAL.title || document.title;
render();
</script>
