  header .stats b { color:var(--fg); }

  button { background:#232834; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:5px 10px; cursor:pointer; font:inherit; }
  button:hover { border-color:var(--acc); }
  button.primary { background:var(--acc); color:#0b1020; border-color:var(--acc); font-weight:600; }
  button.small { padding:2px 8px; font-size:12px; }
  .layout { display:grid; grid-template-columns: var(--left) minmax(0,1fr) var(--right); min-height: calc(100vh - var(--headh)); }
  aside { background:var(--panel); position:sticky; top:var(--headh); height:calc(100vh - var(--headh)); display:flex; flex-direction:column; min-height:0; }
  aside.left { border-right:1px solid var(--line); }
  aside .head { display:flex; gap:6px; align-items:center; margin-bottom:6px; }
  aside .head h2 { flex:1; margin:0; }
  aside h2, main h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--mute); margin:0 0 6px; }
  .tocbox { flex:1 1 auto; min-height:100px; overflow:auto; padding:8px 10px; }
  .toc a { display:grid; grid-template-columns: 10px 42px 1fr; gap:6px; align-items:baseline; color:var(--fg); text-decoration:none; padding:2px 4px; border-radius:5px; font-size:12.5px; }
  .toc a:hover { background:rgba(255,255,255,.04); }
  .toc .dot { width:8px; height:8px; border-radius:50%; background:var(--mute); display:inline-block; }
  .toc .dot.ok { background:var(--ok); } .toc .dot.park { background:var(--park); } .toc .dot.fact { background:var(--warn); } .toc .dot.changed { background:var(--acc); }
  .toc .id { color:var(--acc); font-family:ui-monospace, Consolas, monospace; font-size:12px; }
  .toc .q { color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .evstats { color:var(--mute); font-size:11.5px; padding:6px 10px; border-top:1px solid var(--line); flex:0 0 auto; }
  main { padding:12px 16px calc(var(--outh) + 48px); min-width:0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin:0 0 12px; }
  .card.parked { border-color:var(--park); }
  .card.decided { border-color:var(--ok); }
  .card.changed { border-color:var(--acc); }
  .card.fact { border-style:dashed; }
  .card .head { display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
  .card .id { color:var(--acc); font-weight:700; }
  .badge { font-size:11px; padding:1px 7px; border-radius:10px; border:1px solid var(--line); color:var(--mute); }
  .badge.fact { color:var(--warn); border-color:var(--warn); }
  .badge.ok { color:var(--ok); border-color:var(--ok); }
  .badge.park { color:var(--park); border-color:var(--park); }
  .badge.changed { color:var(--acc); border-color:var(--acc); }
  .card .q { font-size:15px; font-weight:600; margin:4px 0 6px; }
  .meta { color:var(--mute); font-size:12px; margin-bottom:8px; display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .meta a { color:var(--acc); text-decoration:none; }
  .chip { display:inline-flex; gap:4px; align-items:center; border:1px solid var(--line); border-radius:10px; padding:0 6px; font-size:11.5px; }
  .chip.added { border-color:var(--park); color:var(--park); }
  .chip.removed { text-decoration:line-through; opacity:.6; }
  .chip button { padding:0 4px; font-size:11px; border:none; background:transparent; color:var(--mute); }
  .chip button:hover { color:var(--bad); }
  .meta input { width:64px; padding:1px 6px; font-size:12px; }
  .note { padding:6px 10px; border-radius:6px; margin:6px 0; font-size:12.5px; }
  .note.warn { background:rgba(210,153,34,.12); color:var(--warn); }
  .note.bad { background:rgba(248,81,73,.12); color:var(--bad); }
  .note.info { background:rgba(110,168,254,.10); color:var(--fg); }
  .note.park { background:rgba(163,113,247,.12); color:var(--fg); }
  .opt { display:grid; grid-template-columns: 22px 1fr; gap:6px; padding:6px 6px; border-radius:6px; margin:2px 0; }
  .opt:hover { background:rgba(255,255,255,.03); }
  .opt.chosen { background:rgba(63,185,80,.10); }
  .opt .letter { font-weight:700; color:var(--acc); }
  .opt .tag { font-size:11px; padding:0 6px; border-radius:8px; margin-left:6px; border:1px solid; }
  .tag.unlikely { color:var(--unlikely); border-color:var(--unlikely); }
  .tag.added { color:var(--park); border-color:var(--park); }
  .tag.anti { color:var(--bad); border-color:var(--bad); }
  .tag.rec { color:var(--ok); border-color:var(--ok); }
  .tag.journal { color:var(--ok); border-color:var(--ok); }
  .tag.deviation { color:var(--warn); border-color:var(--warn); }
  .ev { display:block; color:var(--mute); font-size:12px; margin:2px 0 0 2px; }
  .ev code { color:#c9d1d9; }
  .ev .ok { color:var(--ok); } .ev .bad { color:var(--bad); }
  .rec { color:var(--mute); font-size:12.5px; margin:6px 0; }
  .rec b { color:var(--ok); }
  textarea, input[type=text], select { width:100%; background:#10131a; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; font:inherit; }
  textarea { min-height:52px; resize:vertical; }
  .row { display:flex; gap:8px; align-items:center; margin:6px 0; flex-wrap:wrap; }
  .row > * { flex:1; }
  .row > button, .row > select, .row > label { flex:0 0 auto; }
  .cons { color:var(--mute); font-size:12px; margin-top:6px; }
  details.park { margin:8px 0; border:1px dashed var(--park); border-radius:8px; padding:4px 10px; }
  details.park summary { cursor:pointer; color:var(--park); font-size:12.5px; }
  .parkitem { display:flex; gap:8px; align-items:baseline; font-size:12.5px; margin:3px 0; }
  .parkitem .who { color:var(--park); flex:0 0 auto; }
  .parkitem button { flex:0 0 auto; }
  .outpanel { position:fixed; left:var(--left); right:var(--right); bottom:0; height:var(--outh); background:var(--panel); border-top:1px solid var(--line); padding:8px 16px; z-index:6; display:flex; flex-direction:column; }
  .outpanel textarea { flex:1 1 auto; min-height:40px; font-family:ui-monospace, Consolas, monospace; font-size:12px; resize:none; }
  .outhandle { position:absolute; left:0; right:0; top:-4px; height:9px; cursor:ns-resize; }
  .outhandle::after { content:''; display:block; width:48px; height:3px; margin:3px auto 0; border-radius:2px; background:var(--line); }
  .outhandle:hover::after { background:var(--acc); }
  .outpanel .row { margin:4px 0; }
  .hidden { display:none; }
  .newfork { border:1px dashed var(--line); border-radius:10px; padding:10px 14px; margin:0 0 12px; }
  .ok-flash { color:var(--ok); font-size:12px; }

  .card.conflict { border-color:var(--bad); }

  </main>
</div>
<main class="view hidden" id="viewCheck"></main>
<main class="view hidden" id="viewAttack"></main>

let mode = 'decisions';
try { const m = localStorage.getItem(KEY + ':mode'); if (MODES.includes(m)) mode = m; } catch (e) {}
let attackState = { disputes:{} };
try { const s = JSON.parse(localStorage.getItem(KEY + ':attack') || 'null'); if (s && s.disputes && typeof s.disputes === 'object') attackState.disputes = s.disputes; } catch (e) {}
let attackLens = 'all';
try { const l = localStorage.getItem(KEY + ':lens'); if (l) attackLens = l; } catch (e) {}
function saveAttack() { try { localStorage.setItem(KEY + ':attack', JSON.stringify(attackState)); } catch (e) {} }
function setMode(m) { mode = m; try { localStorage.setItem(KEY + ':mode', m); } catch (e) {} render(); }
/* ключ спора — файл, раздел и утверждение строки: при повторной атаке спор остаётся у той же строки, не у того же номера */
function disputeKey(att, row) { return att.path + '|' + row.section + '|' + row.claim; }
/* то, что уже внесено в журнал, из состояния браузера убирается: слово к решению, парковка, спор, совпадающий выбор */
(function cleanupIngested() {
  const norm = s => String(s || '').replace(/\s+/g, ' ').trim();
  for (const rec of JOURNAL.records) {
    /* вариант, добавленный человеком и уже внесённый apply (та же буква, тот же текст), из состояния уходит */
    if (state.added[rec.id]) state.added[rec.id] = state.added[rec.id].filter(o => !(rec.options || []).some(x => x.letter === o.letter && norm(String(x.text).split(ADDED_MARK)[0]) === norm(o.text)));
    const d = state.decisions[rec.id]; if (!d) continue;
    const jpark = (rec.parking || []).map(p => norm(p.text));
    const sameDecision = rec.decision && (!d.choice || d.choice === rec.decision.option);
    if (d.word && ((sameDecision && wordIngested(rec.decision.word, d.word)) || jpark.includes(norm(d.word)))) d.word = '';
    d.parked = (d.parked || []).filter(p => norm(p.text) && !jpark.includes(norm(p.text)));
    if (rec.decision && rec.decision.option && d.choice === rec.decision.option) d.choice = null;
    const sp = norm(state.disputes[rec.id]); if (sp && rec.dispute && norm(rec.dispute).includes(sp)) delete state.disputes[rec.id];
  }
  /* новая развилка, уже внесённая apply, из состояния уходит; поправленная человеком остаётся: вопрос другой */
  const questions = new Set(JOURNAL.records.map(r => norm(r.question)));
  state.newForks = (state.newForks || []).filter(f => !questions.has(norm(f.question)));
  const ownNotes = norm(state.notes);
  if (ownNotes && (JOURNAL.notes || []).some(n => norm(n.text).includes(ownNotes))) state.notes = '';
  save();
  /* спор по строке атаки, уже внесённый apply в notes[] журнала, тоже убирается */
  const noteTexts = (JOURNAL.notes || []).map(n => norm(n.text));
  let dropped = false;
  for (const att of ATTACK) for (const r of (att.rows || [])) {
    const k = disputeKey(att, r), sp = norm(attackState.disputes[k]);
    if (sp && noteTexts.some(t => t.includes(sp))) { delete attackState.disputes[k]; dropped = true; }
  }
  if (dropped) saveAttack();
})();
/* высота нижней панели — тянется за ручку, запоминается */
(function outHeight() {
  const root = document.documentElement, hd = document.getElementById('outhandle');
  let h = 170; try { h = +localStorage.getItem(KEY + ':outh') || 170; } catch (e) {}
  root.style.setProperty('--outh', h + 'px');
  let drag = null;
  hd.onmousedown = e => { drag = { y:e.clientY, h }; e.preventDefault(); };
  window.addEventListener('mousemove', e => { if (!drag) return; h = Math.max(70, Math.min(window.innerHeight - 140, drag.h + (drag.y - e.clientY))); root.style.setProperty('--outh', h + 'px'); });
  window.addEventListener('mouseup', () => { if (!drag) return; drag = null; try { localStorage.setItem(KEY + ':outh', String(h)); } catch (e) {} });
})();

/* панель схемы: включается поверх режимов, рисунок — файлом mermaid рядом, иначе текст; файл грузится при первом включении (F-39, F-54, F-122) */
let schemeOn = false, schemeLoaded = false;
try { schemeOn = localStorage.getItem(KEY + ':scheme') === '1'; } catch (e) {}
(function schemeWidth() {
  const root = document.documentElement, hd = document.getElementById('schemehandle');
  let w = 0; try { w = +localStorage.getItem(KEY + ':schemew') || 0; } catch (e) {}
  if (w) root.style.setProperty('--schemew', w + 'px');
  let drag = null;
  hd.onmousedown = e => { drag = { x:e.clientX, w:document.getElementById('schemePanel').offsetWidth }; e.preventDefault(); };
  window.addEventListener('mousemove', e => { if (!drag) return; w = Math.max(240, Math.min(window.innerWidth - 480, drag.w + (drag.x - e.clientX))); root.style.setProperty('--schemew', w + 'px'); });
  window.addEventListener('mouseup', () => { if (!drag) return; drag = null; try { localStorage.setItem(KEY + ':schemew', String(w)); } catch (e) {} });
})();
function schemeShow(st, notes, content) {
  const made = notes.map(([cls, text]) => { const n = document.createElement('div'); n.className = 'note ' + cls; n.textContent = text; return n; });
  document.getElementById('schemeBody').replaceChildren(...made, ...(content ? [content] : []));
  document.getElementById('schemePanel').dataset.state = st;
}
function schemeBlocksNote() {
  const n = SCHEME.blocks;
  return n > 1 ? [['warn', 'в файле ' + n + ' ' + (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? 'блока' : 'блоков') + ', показан первый']] : [];
}
function schemeText(notes) {
  const pre = document.createElement('pre'); pre.textContent = SCHEME.text;
  schemeShow('text', [...schemeBlocksNote(), ...notes], pre);
}
/* сообщение mermaid при незакрытой скобке называет конец текста: верная строка — в hash.loc, от начала блока (F-28, F-61) */
function schemeError(e) {
  const loc = e && e.hash && e.hash.loc;
  const line = loc && Number.isInteger(loc.first_line) ? loc.first_line + SCHEME.first_line - 1 : null;
  const text = String((e && e.message) || e).replace(/^Parse error on line \d+:?\s*/, '');
  return 'Ошибка mermaid' + (line ? ', строка ' + line + ' в scheme.md' : '') + ':\n' + text;
}
async function schemeDraw() {
  try {
    mermaid.initialize({ startOnLoad:false, securityLevel:'strict', theme:'dark', suppressErrorRendering:true });
    const { svg } = await mermaid.render('schemeDrawing', SCHEME.text);
    const holder = document.createElement('div'); holder.innerHTML = svg;
    schemeShow('svg', schemeBlocksNote(), holder);
    const el = holder.querySelector('svg'), vb = el.viewBox && el.viewBox.baseVal;
    if (vb && vb.width) { el.style.width = vb.width + 'px'; el.style.height = vb.height + 'px'; el.style.maxWidth = 'none'; }
    /* натуральный размер шире панели: вначале виден верхний узел посередине, иначе панель пуста, пока не прокрутишь (F-35) */
    const body = document.getElementById('schemeBody'), box = n => n.getBoundingClientRect();
    const nodes = [...el.querySelectorAll('g.node')];
    if (nodes.length) {
      const top = nodes.reduce((a, b) => box(b).top < box(a).top ? b : a);
      body.scrollLeft += box(top).left + box(top).width / 2 - box(body).left - body.clientWidth / 2;
      body.scrollTop = 0;
    }
  } catch (e) { schemeText([['bad', schemeError(e)]]); }
}
function schemeLoad() {
  if (schemeLoaded) return;
  schemeLoaded = true;
  if (!SCHEME.exists) return schemeShow('missing', [['info', 'Схема не создана']]);
  if (SCHEME.text === null) return schemeShow('empty', [['info', 'В scheme.md нет схемы']]);
  const noFile = () => schemeText([['info', 'Файла mermaid рядом нет: показан текст схемы']]);
  if (!SCHEME.mermaid) return noFile();
  const s = document.createElement('script');
  s.src = SCHEME.mermaid; s.onload = schemeDraw; s.onerror = noFile;
  document.head.appendChild(s);
}
function headerHeight() {
  const h = document.getElementById('pageHeader').offsetHeight;
  if (h) document.documentElement.style.setProperty('--headh', h + 'px');
}
window.addEventListener('resize', headerHeight);
function renderSchemePanel() {
  document.getElementById('schemePanel').classList.toggle('hidden', !schemeOn);
  document.body.classList.toggle('scheme-on', schemeOn);
  document.getElementById('btnScheme').classList.toggle('active', schemeOn);
  if (schemeOn) schemeLoad();
}

function dec(id) { return state.decisions[id] || (state.decisions[id] = { choice:null, word:'', parked:[] }); }
function journalChoice(rec) { return rec.decision && rec.decision.option ? rec.decision.option : null; }
function chosen(id) { const d = state.decisions[id]; if (d && d.choice) return d.choice; return journalChoice(byId[id] || {}); }
function effectiveDeps(rec) {
  const u = state.deps[rec.id] || { add:[], remove:[] };
  const base = (rec.depends_on || []).map(x => ({ id:x, kind: u.remove.includes(x) ? 'removed' : 'journal' }));
  return base.concat(u.add.map(x => ({ id:x, kind:'added' })));
}
function allOptions(rec) { return rec.options.concat((state.added[rec.id] || []).map(o => Object.assign({ evidence:[], unlikely:null, added:true, local:true }, o))); }
function antipodesOf(id, letter) {
  const out = new Set();
  for (const a of (byId[id].antipodes || [])) if (a.option === letter) out.add(a.other);
  for (const r of JOURNAL.records) for (const a of (r.antipodes || [])) if (a.other === id + '.' + letter) out.add(r.id + '.' + a.option);
  return [...out];
}
function chosenAntipodes(id, letter) { return antipodesOf(id, letter).filter(k => { const [oid, ol] = k.split('.'); return chosen(oid) === ol; }); }
/* text:begin */
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
/* текст журнала и атаки: единственная разметка данных — пары backticks; сначала экранирование, потом `код` -> <code> */
function md(s) { return esc(s).replace(/`([^`]+)`/g, '<code>$1</code>'); }
/* text:end */
function evHtml(ev) {
  const loc = ev.line ? ev.path + ':' + ev.line : ev.path;
  /* found: null — файл не текст (бинарный, не UTF-8): сверить нельзя, это не пропажа цитаты */
  const v = ev.found ? '<b class="ok">сверено</b>'
    : ev.found === null ? '<b class="mute">' + esc(/^не проверить/.test(ev.verdict || '') ? ev.verdict : 'не проверить: ' + (ev.verdict || 'файл не текст')) + '</b>'
    : '<b class="bad">не найдено: ' + esc(ev.verdict || '') + '</b>';
  return '<span class="ev">улика: <code>' + esc(loc) + '</code> «' + esc(ev.quote) + '» ' + v + '</span>';
}

function visible(rec) {
  if (filter.openOnly) { if (rec.kind === 'факт' || chosen(rec.id)) return false; }
  return true;
}

/* ---------- карточки ---------- */
function renderCards() {
  const el = document.getElementById('cards');
  el.innerHTML = JOURNAL.records.filter(visible).map(rec => {
    const d = dec(rec.id);
    const isFact = rec.kind === 'факт';
    const jc = journalChoice(rec);
    const localChoice = d.choice;
    const changed = !!(localChoice && jc && localChoice !== jc);
    const jpark = (rec.parking || []).map(p => ({ text:p.text, addressee:p.addressee, journal:true }));
    const parkedAll = jpark.concat(d.parked || []);
    const cls = ['card', isFact ? 'fact' : '', changed ? 'changed' : (chosen(rec.id) ? 'decided' : ''), parkedAll.length ? 'parked' : ''].join(' ');
    let status = isFact ? '<span class="badge fact">факт · закрыт уликами</span>'
      : changed ? '<span class="badge changed">изменено: ' + esc(jc) + ' → ' + esc(localChoice) + '</span>'
      : localChoice ? '<span class="badge ok">решено здесь: ' + esc(localChoice) + '</span>'
      : jc ? '<span class="badge ok">решено в журнале: ' + esc(jc) + '</span>' : '<span class="badge">открыто</span>';
    if (parkedAll.length) status += '<span class="badge park">парковка: ' + parkedAll.length + '</span>';
    const deps = effectiveDeps(rec);
    /* факт решения не требует: предпосылка ждёт только у развилки без выбора и у припаркованного факта */
    const settled = id => chosen(id) || (byId[id] && byId[id].kind === 'факт' && byId[id].status === 'решён');
    const waiting = deps.filter(x => x.kind !== 'removed' && !settled(x.id)).map(x => x.id);
    let html = '<div class="' + cls + '" id="' + esc(rec.id) + '"><div class="head"><span class="id mono">' + esc(rec.id) + '</span>' + status +
      '<span class="badge">' + esc(rec.delivery || '—') + '</span>' + (rec.addressee ? '<span class="badge">адресат: ' + esc(rec.addressee) + '</span>' : '') + '</div>' +
      '<div class="q">' + md(rec.question) + '</div>';
    html += '<div class="meta">зависит от: ' + (deps.length ? deps.map(x => '<span class="chip ' + x.kind + '"><a href="#' + esc(x.id) + '">' + esc(x.id) + '</a>' +
      (x.kind === 'removed' ? '<button data-undep="' + esc(rec.id) + '|' + esc(x.id) + '" title="вернуть">↺</button>' : '<button data-rmdep="' + esc(rec.id) + '|' + esc(x.id) + '" title="снять зависимость">×</button>') + '</span>').join('') : '—') +
      '<input type="text" data-deptext="' + esc(rec.id) + '" placeholder="F-NN" title="добавить зависимость"><button class="small" data-adddep="' + esc(rec.id) + '">+ зависимость</button></div>';
    if (waiting.length) html += '<div class="note warn">предпосылка не решена: ' + waiting.map(esc).join(', ') + ' — выбирать можно, но ответ до неё — догадка</div>';
    if (rec.evidence && rec.evidence.length && !isFact) html += '<div class="note info"><b>улики записи</b>' + rec.evidence.map(evHtml).join('') + '</div>';
    if (rec.finding) html += '<div class="note info"><b>находка:</b> ' + md(rec.finding) + '</div>';
    if (isFact) {
      html += rec.evidence.map(evHtml).join('');
      if (rec.dispute) html += '<div class="note park"><b>спор в журнале:</b> ' + md(rec.dispute) + '</div>';
      html += '<div class="cons">следствия: ' + md(rec.consequences || '—') + '</div>';
      html += '<div class="row"><textarea data-dispute="' + esc(rec.id) + '" placeholder="оспорить факт: что не так и чем это подтверждается">' + esc(state.disputes[rec.id] || '') + '</textarea></div>';
    } else {
      const cur = chosen(rec.id);
      for (const o of allOptions(rec)) {
        const paired = chosenAntipodes(rec.id, o.letter);
        const anti = antipodesOf(rec.id, o.letter);
        const tags = (rec.recommendation && rec.recommendation.option === o.letter ? '<span class="tag rec">рекомендация</span>' : '') +
          (jc === o.letter ? '<span class="tag journal">в журнале</span>' : '') +
          (o.unlikely ? '<span class="tag unlikely" title="' + esc(o.unlikely) + '">маловероятно</span>' : '') +
          (o.added ? '<span class="tag added">добавлен человеком</span>' : '') +
          deviationTag(o) +
          (anti.length ? '<span class="tag anti" title="нельзя вместе с: ' + esc(anti.join(', ')) + '">антипод ' + esc(anti.join(', ')) + '</span>' : '');
        html += '<label class="opt' + (cur === o.letter ? ' chosen' : '') + '">' +
          '<input type="radio" name="' + esc(rec.id) + '" value="' + esc(o.letter) + '"' + (cur === o.letter ? ' checked' : '') + '>' +
          '<div class="t"><span class="letter">' + esc(o.letter) + '.</span> ' + md(o.text) + tags +
          (o.unlikely ? '<span class="ev">маловероятно: ' + md(o.unlikely) + '</span>' : '') +
          (paired.length ? '<span class="note warn" data-antipode-warning="' + esc(rec.id + '.' + o.letter) + '">антипод уже выбран: ' + esc(paired.join(', ')) + '. Выбрать можно, но вместе они станут строкой атаки.</span>' : '') +
          (o.evidence || []).map(evHtml).join('') + '</div></label>';
      }
      if (rec.recommendation) html += '<div class="rec">рекомендация: <b>' + esc(rec.recommendation.option) + '</b> — ' + md(rec.recommendation.why) + '</div>';
      if (rec.decision && rec.decision.word) html += '<div class="note info"><b>слово в журнале (' + esc(rec.decision.date || '') + '):</b> «' + md(rec.decision.word) + '»</div>';
      html += '<div class="note bad hidden" data-msg="' + esc(rec.id) + '"></div>';
      html += '<div class="row"><textarea data-word="' + esc(rec.id) + '" placeholder="слово человека дословно — почему так (или что изменить в решении из журнала)">' + esc(d.word || '') + '</textarea></div>';
      html += '<div class="row"><input type="text" data-addtext="' + esc(rec.id) + '" placeholder="вариант, которого здесь нет"><button class="small" data-addopt="' + esc(rec.id) + '">добавить вариант</button></div>';
      html += '<details class="park"' + (parkedAll.length ? ' open' : '') + '><summary title="' + esc(PARK_HINT) + '">парковка — дополнительный вопрос с адресатом (' + parkedAll.length + ')</summary>' +
        '<div class="note park" style="margin:6px 0">' + esc(PARK_HINT) + '</div>' +
        parkedAll.map((p, i) => '<div class="parkitem"><span class="who">→ ' + esc(p.addressee || '?') + (p.journal ? ' · в журнале' : '') + '</span><span>' + md(p.text || '(без текста)') + '</span>' +
          (p.journal ? '' : '<button class="small" data-unpark="' + esc(rec.id) + '|' + (i - jpark.length) + '">снять</button>') + '</div>').join('') +
        '<div class="row"><input type="text" data-parktext="' + esc(rec.id) + '" placeholder="что именно надо узнать или решить отдельно">' +
        '<select data-addressee="' + esc(rec.id) + '" title="' + esc(PARK_HINT) + '">' + ADDRESSEES.map(a => '<option>' + a + '</option>').join('') + '</select>' +
        '<button class="small" data-park="' + esc(rec.id) + '">припарковать</button></div></details>';
      html += '<div class="cons">следствия: ' + md(rec.consequences || '—') + '</div>';
    }
    return html + '</div>';
  }).join('');

  el.querySelectorAll('input[type=radio]').forEach(r => r.onchange = () => {
    const id = r.name, letter = r.value;
    const d = dec(id); d.choice = (letter === journalChoice(byId[id])) ? null : letter; save(); render();
  });
  el.querySelectorAll('textarea[data-word]').forEach(t => t.oninput = () => { dec(t.dataset.word).word = t.value; save(); updateOut(); });
  el.querySelectorAll('textarea[data-dispute]').forEach(t => t.oninput = () => { state.disputes[t.dataset.dispute] = t.value; save(); updateOut(); });
  el.querySelectorAll('button[data-addopt]').forEach(b => b.onclick = () => {
    const id = b.dataset.addopt, inp = el.querySelector('input[data-addtext="' + id + '"]');
    const text = (inp.value || '').trim(); if (!text) return;
    const letters = allOptions(byId[id]).map(o => o.letter);
    const next = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').find(l => !letters.includes(l));
    (state.added[id] = state.added[id] || []).push({ letter: next, text }); save(); render();
  });
  el.querySelectorAll('button[data-park]').forEach(b => b.onclick = () => {
    const id = b.dataset.park, text = (el.querySelector('input[data-parktext="' + id + '"]').value || '').trim();
    const addressee = el.querySelector('select[data-addressee="' + id + '"]').value;
    if (!text) { const m = el.querySelector('[data-msg="' + id + '"]'); m.textContent = 'парковка без вопроса — нечего адресовать'; m.classList.remove('hidden'); return; }
    dec(id).parked.push({ text, addressee }); save(); render();
  });
  el.querySelectorAll('button[data-unpark]').forEach(b => b.onclick = () => { const [id, i] = b.dataset.unpark.split('|'); dec(id).parked.splice(+i, 1); save(); render(); });
  el.querySelectorAll('button[data-adddep]').forEach(b => b.onclick = () => {
    const id = b.dataset.adddep, inp = el.querySelector('input[data-deptext="' + id + '"]');
    const dep = (inp.value || '').trim().toUpperCase().replace(/^F(\d)/, 'F-$1');
    const m = el.querySelector('[data-msg="' + id + '"]');
    if (!byId[dep]) { m.textContent = 'нет записи ' + dep; m.classList.remove('hidden'); return; }
    if (dep === id) { m.textContent = 'запись не может зависеть от себя'; m.classList.remove('hidden'); return; }
    const u = state.deps[id] = state.deps[id] || { add:[], remove:[] };
    if (byId[id].depends_on.includes(dep)) { u.remove = u.remove.filter(x => x !== dep); }
    else if (!u.add.includes(dep)) u.add.push(dep);
    save(); render();
  });
  el.querySelectorAll('button[data-rmdep]').forEach(b => b.onclick = () => {
    const [id, dep] = b.dataset.rmdep.split('|');
    const u = state.deps[id] = state.deps[id] || { add:[], remove:[] };
    if (u.add.includes(dep)) u.add = u.add.filter(x => x !== dep); else if (!u.remove.includes(dep)) u.remove.push(dep);
    save(); render();
  });
  el.querySelectorAll('button[data-undep]').forEach(b => b.onclick = () => {
    const [id, dep] = b.dataset.undep.split('|');
    const u = state.deps[id]; if (u) u.remove = u.remove.filter(x => x !== dep); save(); render();
  });
}

function renderNewForks() {
  document.getElementById('newForks').innerHTML = state.newForks.map((f, i) =>
    '<div class="card" style="margin-top:8px"><div class="head"><span class="id mono">' + esc(f.id) + '</span><span class="badge added">добавлена человеком</span>' +
    '<button class="small" data-delfork="' + i + '" style="margin-left:auto">убрать</button></div><div class="q">' + md(f.question) + '</div>' +
    '<div class="meta">варианты: ' + md(f.options.replace(/\n+/g, ' · ')) + '</div><div class="cons">' + md(f.word) + '</div></div>').join('');
  document.querySelectorAll('button[data-delfork]').forEach(b => b.onclick = () => { state.newForks.splice(+b.dataset.delfork, 1); save(); render(); });
}

function renderToc() {
  document.getElementById('toc').innerHTML = JOURNAL.records.map(rec => {
    const d = state.decisions[rec.id];
    const jc = journalChoice(rec);
    const dot = rec.kind === 'факт' ? 'fact' : (d && d.choice && jc && d.choice !== jc) ? 'changed' : chosen(rec.id) ? 'ok' : (((rec.parking && rec.parking.length) || (d && d.parked && d.parked.length)) ? 'park' : '');
    return '<a href="#' + esc(rec.id) + '"><span class="dot ' + dot + '"></span><span class="id">' + esc(rec.id) + '</span><span class="q" title="' + esc(rec.question) + '">' + esc(rec.question) + '</span></a>';
  }).join('');

function renderStats() {

  const parked = forks.filter(r => (r.parking && r.parking.length) || (state.decisions[r.id] && state.decisions[r.id].parked.length)).length;

    ' · открыто <b>' + (forks.length - decided) + '</b> · с парковкой <b>' + parked + '</b> · фактов <b>' + (JOURNAL.records.length - forks.length) + '</b>' +
    (disputed ? ' · оспорено <b>' + disputed + '</b>' : '') + (state.newForks.length ? ' · добавлено развилок <b>' + state.newForks.length + '</b>' : '');

  document.getElementById('evstats').textContent = 'улик сверено ' + (s.evidence_found ?? '?') + ' из ' + (s.evidence_total ?? '?') + ' · собрано ' + (JOURNAL.generated || '');
}

/* prompt:begin */
/* Промпт возврата — чистая функция состояния: без DOM, без обращения к страницам. Строки пишутся по грамматике `journal_apply.parse_answers`.
   Уходит всё, что `apply` уже внёс в журнал: вариант с тем же текстом, слово, равное слову решения, парковка, зависимость, замечание.
   Ответ в поле спора строки атаки (закрытие «вопрос человека», раздел `F-NN, decision`) — слово к решению `- F-NN: <буква> — «…»`, одна строка
   на запись; два разных ответа — конфликт: строки нет, в замечаниях «конфликт ответов к F-NN — оставьте один», `conflictKeys` — ключи спора
   строк, которые его составили. Ответ к записи без решения — замечание `F-NN: ответ`, ключи — `undecidedKeys`. Возвращает { text, conflictKeys, undecidedKeys }. */
/* слово уже в решении журнала: `apply` дописывает новое слово к прежнему (`journal_apply._merge`, проверка вхождением),
   поэтому внесённое — вхождение в слово решения, а не равенство; пробелы схлопываются, как в `_flat` */
function wordIngested(journalWord, word) {
  const n = s => String(s == null ? '' : s).replace(/\s+/g, ' ').trim();
  const w = n(word);
  return w !== '' && n(journalWord).includes(w);
}
function buildPrompt(J, attacks, st, disputes, date) {
  const MARK = '(добавлен человеком';
  const norm = s => String(s == null ? '' : s).replace(/\s+/g, ' ').trim();
  const shorten = (s, n) => { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; };
  const byId = Object.fromEntries(J.records.map(r => [r.id, r]));
  const jchoice = rec => (rec.decision && rec.decision.option) || null;
  /* рекомендация не решение: буква — выбор в состоянии или решение журнала, иначе её нет */
  const letterOf = (rec, d) => (d && d.choice) || jchoice(rec) || null;
  const lines = ['Решения по журналу ' + (J.source || '') + ', ' + date + ':'];
  /* споры по строкам атаки: слово к решению или заметка */
  const answers = {}, otherDisputes = [], undecidedKeys = [];
  for (const att of (attacks || [])) for (const r of (att.rows || [])) {
    const key = att.path + '|' + r.section + '|' + r.claim, sp = norm((disputes || {})[key]);
    if (!sp) continue;
    const m = /^(F-\d+),\s*decision\b/.exec(norm(r.section)), rec = m && byId[m[1]];
    const askHuman = rec && rec.kind === 'развилка' && norm(r.fix).toLowerCase() === 'вопрос человеку';
    if (askHuman && letterOf(rec, st.decisions[rec.id])) {
      (answers[rec.id] = answers[rec.id] || []).push({ key, text: sp });
    } else if (askHuman) {   /* запись без решения: слова без выбора нет, ответ — замечание `F-NN: …`, запись остаётся открытой */
      undecidedKeys.push(key); otherDisputes.push(rec.id + ': ' + sp);
    } else otherDisputes.push('атака ' + att.path + ' · ' + r.lens + ' · «' + shorten(r.claim, 60) + '» — спор: ' + sp);
  }
  const conflicts = [], conflictKeys = [];
  for (const rec of J.records) {
    const d = st.decisions[rec.id];
    if (rec.kind === 'факт') { const sp = norm(st.disputes[rec.id]); if (sp) lines.push('- ' + rec.id + ': факт оспорен — «' + sp + '»'); continue; }
    const jc = jchoice(rec), jword = rec.decision ? norm(rec.decision.word) : '';
    for (const o of (st.added[rec.id] || [])) {
      const known = (rec.options || []).some(x => x.letter === o.letter && norm(String(x.text).split(MARK)[0]) === norm(o.text));
      if (!known) lines.push('- ' + rec.id + ': добавлен вариант ' + o.letter + '. ' + o.text);
    }
    const u = st.deps[rec.id], deps = rec.depends_on || [];
    if (u) {
      for (const x of u.add) if (!deps.includes(x)) lines.push('- ' + rec.id + ': зависимость добавлена ' + x);
      for (const x of u.remove) if (deps.includes(x)) lines.push('- ' + rec.id + ': зависимость снята ' + x);
    }
    if (d) {
      const w = (d.word || '').trim(), jpark = (rec.parking || []).map(p => norm(p.text));
      for (const p of (d.parked || [])) if (!jpark.includes(norm(p.text))) lines.push('- ' + rec.id + ': припарковано → ' + p.addressee + ' — «' + p.text + '»');
      if (d.choice && d.choice !== jc) lines.push('- ' + rec.id + ': ' + d.choice + (jc ? ' (было ' + jc + ')' : '') + (w ? ' — «' + w + '»' : ' — (без слова)'));
      else if (w && !wordIngested(jword, w)) lines.push('- ' + rec.id + ': ' + (jc ? 'к решению ' + jc : 'без выбора') + ' — «' + w + '»');
    }
    const letter = letterOf(rec, d);
    const ans = (answers[rec.id] || []).filter(a => !(jc && letter === jc && wordIngested(jword, a.text)));   /* слово, уже вошедшее в decision, — не добавляется */
    const distinct = [...new Set(ans.map(a => a.text))];
    if (distinct.length > 1) { conflicts.push(rec.id); ans.forEach(a => conflictKeys.push(a.key)); }
    else if (distinct.length === 1) lines.push('- ' + rec.id + ': ' + letter + ' — «' + distinct[0] + '»');
  }
  if (st.newForks.length) { lines.push('Новые развилки:'); for (const f of st.newForks) lines.push('- ' + f.id + ': ' + f.question + ' — варианты: ' + f.options.replace(/\n+/g, ' | ') + (f.word ? ' — «' + f.word + '»' : '')); }
  /* замечания к схеме одной строкой: замечания режима 1 первыми, споры по атаке, конфликты ответов; уже внесённое в notes[] журнала уходит */
  const own = (st.notes || '').trim(), ingested = (J.notes || []).some(n => norm(n.text).includes(norm(own)));
  const notes = [own && !ingested ? own : ''].concat(otherDisputes, conflicts.map(id => 'конфликт ответов к ' + id + ' — оставьте один')).filter(Boolean);
  if (notes.length) lines.push('Замечания к схеме: ' + notes.join(' · '));
  if (lines.length === 1) lines.push('(нового нет — решения из журнала остаются как есть, молчание по открытой развилке оставляет её открытой)');
  return { text: lines.join('\n'), conflictKeys, undecidedKeys };
}
/* prompt:end */
function currentPrompt() { return buildPrompt(JOURNAL, ATTACK, state, attackState.disputes, new Date().toISOString().slice(0, 10)); }
function updateOut() { document.getElementById('out').value = currentPrompt().text; markConflicts(); }

/* ---------- общее для режимов 2 и 3 ---------- */
function isProbe(rec) { return !!(rec.outcome && rec.outcome.kind === 'проба'); }
function isAdded(o) { return !!o.added || String(o.text || '').includes(ADDED_MARK); }
/* тег «отступление от F-NN» у варианта с `deviation` — один вид в карточке, «проверке» и блоке записи «атаки» */
function deviationTag(o) { return o && o.deviation ? '<span class="tag deviation">отступление от ' + esc(o.deviation) + '</span>' : ''; }
function isOneWay(rec) { return !!(rec.reversibility && rec.reversibility.level === ONE_WAY); }
function num(id) { return parseInt(String(id).slice(2), 10) || 0; }
function allEvidence(rec) { return (rec.evidence || []).concat(...(rec.options || []).map(o => o.evidence || [])); }
function shaChip(sha, missing) { return sha ? '<code title="' + esc(sha) + '">' + esc(sha.slice(0, 12)) + '</code>' : '<span class="mute">' + esc(missing) + '</span>'; }
function journalTarget(att) { return ((att.frontmatter || {}).targets || []).find(t => t.path === 'decisions.json'); }
/* сверка хеша цели decisions.json из frontmatter атаки с хешем файла журнала, который встроил render-html (ключ sha256) */
function verdictNote(att) {
  const t = journalTarget(att);
  if (!t || !JOURNAL.sha256) return '';
  if (!t.sha256) return '<span class="badge warn">хеш журнала в атаке не записан</span>';
  return t.sha256 === JOURNAL.sha256 ? '<span class="badge ok">хеш журнала совпал</span>' : '<span class="badge bad">вердикт устарел: журнал изменён после атаки</span>';
}

/* ---------- режим 2 — проверка: снимок решений перед proposal, только чтение ---------- */
/* проекция «куда уйдёт» — зеркало render_design (tools/journal_render.py): решённая развилка, не проба → Decisions
   («в одну сторону» — первыми); проба Specify* → spec.md; Backstop → тест-страховка в tasks.md, в design.md её нет;
   Dismiss → никуда, с причиной; Defer и открытая развилка → Open Questions; факт → Context, спорный — ещё и Open Questions */
function destination(rec) {
  if (rec.kind === 'факт') return { label:'design.md › Context', note: (rec.dispute || '').trim() ? 'спор → design.md › Open Questions' : '' };
  if (isProbe(rec)) {
    const v = String(rec.outcome.value || ''), reason = (rec.outcome.reason || '').trim();
    if (v.startsWith('Specify')) return { label:'spec.md', note:'исход ' + v };
    if (v === 'Backstop') return { label:'tasks.md › тест-страховка', note:'в design.md не попадает' };
    if (v === 'Dismiss') return { label:'никуда', note: reason ? 'причина: ' + reason : 'причина не записана' };
    if (v === 'Defer') return { label:'design.md › Open Questions', note:'отложена (Defer)' };
    return { label:'никуда', note:'исход «' + v + '» вне четырёх' };
  }
  if (rec.decision && rec.decision.option) return { label:'design.md › Decisions', note: isOneWay(rec) ? 'в одну сторону — первой' : '' };
  return { label:'design.md › Open Questions', note:'открыта' };
}
/* парковки: render_design кладёт каждую в Open Questions; адресат говорит, где ищется ответ */
function parkingDestination(addressee) { return 'design.md › Open Questions → ' + ({ 'ИБ':'security.md', 'материалы':'research/', 'человек':'вопрос человеку' }[addressee] || '—'); }

function checkCard(rec) {
  const d = destination(rec), isFact = rec.kind === 'факт';
  const picked = rec.decision && rec.decision.option ? (rec.options || []).find(o => o.letter === rec.decision.option) : null;
  let html = '<div class="card' + (isFact ? ' fact' : picked ? ' decided' : '') + '"><div class="head"><span class="id mono">' + esc(rec.id) + '</span>' +
    '<span class="badge">' + esc(rec.kind) + ' · ' + esc(rec.status) + '</span><span class="badge">' + esc(rec.delivery || '—') + '</span>' +
    (isOneWay(rec) ? '<span class="badge warn">в одну сторону</span>' : '') +
    '<span class="badge dest" title="куда уйдёт — по правилам render-design">→ ' + esc(d.label) + (d.note ? ' · ' + esc(d.note) : '') + '</span></div>' +
    '<div class="q">' + md(rec.question) + '</div>';
  if (picked) html += '<div class="opt chosen"><span class="letter">' + esc(picked.letter) + '.</span><div>' + md(picked.text) + (isAdded(picked) ? '<span class="tag added">добавлен человеком</span>' : '') + deviationTag(picked) + '</div></div>';
  if (rec.decision && rec.decision.word) html += '<div class="note info"><b>слово (' + esc(rec.decision.date || 'без даты') + '):</b> «' + md(rec.decision.word) + '»</div>';
  if (rec.reversibility) html += '<div class="meta">обратимость: ' + esc(rec.reversibility.level) + (rec.reversibility.why ? ' — ' + md(rec.reversibility.why) : '') + '</div>';
  if (rec.outcome) html += '<div class="meta">исход: ' + esc(rec.outcome.kind) + ' — <b>' + esc(rec.outcome.value) + '</b>' + (rec.outcome.reason ? ' — ' + md(rec.outcome.reason) : '') + '</div>';
  if (!picked && !isFact) {
    html += (rec.options || []).map(o => '<div class="opt"><span class="letter">' + esc(o.letter) + '.</span><div>' + md(o.text) +
      (o.unlikely ? '<span class="tag unlikely">маловероятно: ' + md(o.unlikely) + '</span>' : '') + (isAdded(o) ? '<span class="tag added">добавлен человеком</span>' : '') + deviationTag(o) + '</div></div>').join('');
    if (rec.recommendation) html += '<div class="rec">рекомендация: <b>' + esc(rec.recommendation.option || '') + '</b> — ' + md(rec.recommendation.why || rec.recommendation.text || '') + '</div>';
  } else if (picked) {
    const added = (rec.options || []).filter(o => isAdded(o) && o.letter !== picked.letter);
    if (added.length) html += '<div class="meta">добавлены человеком: ' + esc(added.map(o => o.letter + '. ' + o.text).join('; ')) + '</div>';
  }
  if (isFact) {
    html += (rec.evidence || []).map(evHtml).join('');
    html += (rec.dispute || '').trim() ? '<div class="note park"><b>спор:</b> ' + md(rec.dispute) + '</div>' : '<div class="meta">спора нет</div>';
  }
  if (rec.consequences) html += '<div class="cons">следствия: ' + md(rec.consequences) + '</div>';
  return html + '</div>';
}

function renderCheck() {
  const recs = JOURNAL.records, forks = recs.filter(r => r.kind === 'развилка');
  const decidedAll = forks.filter(r => r.decision && r.decision.option);
  const decided = decidedAll.filter(r => !isProbe(r)), probes = recs.filter(isProbe);
  const open = forks.filter(r => !(r.decision && r.decision.option)), facts = recs.filter(r => r.kind === 'факт');
  const parkings = recs.flatMap(r => (r.parking || []).map(p => Object.assign({ rec:r.id }, p)));
  const snapshot = ATTACK.find(journalTarget);
  let html = '<div class="card"><div class="head"><span class="id mono">снимок</span><span class="badge">' + esc(JOURNAL.source || '') + '</span>' +
    '<span class="badge">sha256 журнала: ' + shaChip(JOURNAL.sha256, 'не подан — рендер не из файла') + '</span>' +
    (snapshot ? '<span class="badge ' + (snapshot.frontmatter.status === 'passed' ? 'ok' : 'park') + '">атака: ' + esc(snapshot.frontmatter.status || '—') + '</span>' + verdictNote(snapshot)
              : '<span class="badge">атака не подана</span>') +
    '</div><div class="q">' + md(JOURNAL.title || '') + '</div>' +
    '<div class="meta">только чтение: режим ничего не пишет и вердиктом не считается — снимок решений перед proposal и spec.md; «→» у записи — куда она уйдёт по правилам render-design</div></div>';
  html += '<div class="counters">решено <b>' + decidedAll.length + '</b> · открыто <b>' + open.length + '</b> · припарковано: ' +
    ADDRESSEES.map(a => esc(a) + ' <b>' + parkings.filter(p => p.addressee === a).length + '</b>').join(' / ') +
    ' · фактов оспорено <b>' + facts.filter(r => (r.dispute || '').trim()).length + '</b>' +
    ' · улик не найдено <b>' + recs.flatMap(allEvidence).filter(ev => ev.found === false).length + '</b></div>';
  const dates = [...new Set(decided.map(r => r.decision.date || ''))].sort((a, b) => a < b ? 1 : a > b ? -1 : 0);
  html += '<h2>Решено — по дате решения · ' + decided.length + '</h2>' + (dates.length ? '' : '<div class="meta">—</div>');
  for (const date of dates) {
    const group = decided.filter(r => (r.decision.date || '') === date).sort((a, b) => (isOneWay(b) - isOneWay(a)) || (num(a.id) - num(b.id)));
    html += '<h3>' + (date ? esc(date) : 'без даты') + ' · ' + group.length + '</h3>' + group.map(checkCard).join('');
  }
  const section = (title, list) => '<h2>' + title + ' · ' + list.length + '</h2>' + (list.length ? list.map(checkCard).join('') : '<div class="meta">—</div>');
  html += section('Открытые развилки — с рекомендацией', open) + section('Пробы — с исходом', probes) + section('Факты — улики и спор', facts);
  html += '<h2>Парковки — по адресатам · ' + parkings.length + '</h2>' + (parkings.length ? '' : '<div class="meta">—</div>');
  for (const a of ADDRESSEES) {
    const ps = parkings.filter(p => p.addressee === a); if (!ps.length) continue;
    html += '<h3>→ ' + esc(a) + ' · ' + ps.length + ' <span class="badge dest">' + esc(parkingDestination(a)) + '</span></h3>' +
      ps.map(p => '<div class="parkitem"><span class="who mono">' + esc(p.rec) + '</span><span>' + md(p.text) + (p.finding ? ' — <b>находка:</b> ' + md(p.finding) : '') + '</span></div>').join('');
  }
  const notes = JOURNAL.notes || [];
  html += '<h2>Заметки · ' + notes.length + '</h2>' + (notes.length ? '<ul>' + notes.map(n => '<li><span class="mono">' + esc(n.date) + '</span> — ' + md(n.text) + '</li>').join('') + '</ul>' : '<div class="meta">—</div>');
  document.getElementById('viewCheck').innerHTML = html;
}

/* ---------- режим 3 — атака: строки attack/*.md, фильтр по линзе, линза → тяжесть → строки ---------- */
/* какой закрытый список линз у файла: журнал — единственная цель `decisions.json`, иначе артефакты */
function attackKind(att) { const t = (att.frontmatter || {}).targets || []; return t.length === 1 && t[0].path === 'decisions.json' ? 'journal' : 'artifacts'; }
function lensList(att) { return ATTACK_LENSES[attackKind(att)]; }
function lensLabel(att, slug) { const l = lensList(att).find(x => x.slug === slug); return l ? l.label : ''; }
/* тяжесть — первое слово ячейки; причина понижения — текст в скобках после него */
function sevBase(s) { const m = /^(блокер|предупреждение|справка)(?![а-яёa-z])/i.exec(String(s || '').trim()); return m ? m[1].toLowerCase() : String(s || '').trim(); }
function sevReason(s) { const m = /\(([^)]+)\)/.exec(String(s || '')); return m ? m[1].trim() : ''; }
function sevClass(s) { const b = sevBase(s); return b === 'блокер' ? 'bad' : b === 'предупреждение' ? 'warn' : b === 'справка' ? '' : 'park'; }
/* при опоре «нет» тяжесть источника — блокер; ниже блокера без причины в скобках — понижение без причины, с причиной — понижение с видимой причиной (F-54.E) */
function demotion(r) {
  const noSupport = /^нет(?![а-яёa-z0-9])/i.test(String(r.support || '').trim());
  if (!noSupport || sevBase(r.severity) === 'блокер') return null;
  return { reason: sevReason(r.severity) };
}
function demotionBadge(r) {
  const d = demotion(r);
  if (!d) return '';
  return d.reason ? '<span class="badge warn">понижено: ' + esc(d.reason) + '</span>' : '<span class="badge bad">понижение без причины</span>';
}
/* раздел вида `F-NN, поле` с записью в журнале — переход к карточке в режиме 1, не слияние сущностей; якорь строится только из `F-NN` */
function recordIdOf(section) { const m = /^(F-\d+)(?!\d)/.exec(String(section || '').trim()); return m && byId[m[1]] ? m[1] : null; }
function sectionHtml(section) {
  const id = recordIdOf(section);
  if (id) return '<a href="#' + id + '" data-goto="' + id + '" title="к записи ' + id + ' в режиме «решения»">' + esc(section) + '</a>';
  return esc(section);
}
/* скрываемый блок с текстом записи, на которую ссылается раздел строки: вопрос, выбранный вариант, переход к карточке (F-18.A) */
function recordBlock(section) {
  const id = recordIdOf(section);
  if (!id) return '';
  const rec = byId[id], picked = rec.decision && rec.decision.option ? (rec.options || []).find(o => o.letter === rec.decision.option) : null;
  return '<details class="recblock"><summary>запись ' + id + ' — текст вопроса</summary><div class="q">' + md(rec.question) + '</div>' +
    (picked ? '<div class="opt chosen"><span class="letter">' + esc(picked.letter) + '.</span><div>' + md(picked.text) + deviationTag(picked) + '</div></div>'
            : '<div class="meta">решения нет — запись открыта</div>') +
    '<div class="meta"><a href="#' + id + '" data-goto="' + id + '">к карточке ' + id + ' в режиме «решения»</a></div></details>';
}
function attackRow(att, ai, ri, r, conflict, undecided) {
  const key = disputeKey(att, r), known = lensList(att).some(l => l.slug === r.lens);
  return '<div class="card attackrow' + (conflict ? ' conflict' : '') + '" data-card="' + ai + '|' + ri + '"><div class="head"><span class="badge ' + sevClass(r.severity) + '">' + esc(r.severity) + '</span>' + demotionBadge(r) +
    '<span class="badge">' + sectionHtml(r.section) + '</span>' +
    (known ? '' : '<span class="badge bad">линза «' + esc(r.lens) + '» вне списка — строка невалидна</span>') + '</div>' +
    '<div class="q">' + md(r.claim) + '</div>' +
    '<div class="meta">инвариант: ' + md(r.invariant) + '</div><div class="meta">опора: ' + md(r.support) + '</div><div class="meta">чем закрыть: ' + md(r.fix) + '</div>' +
    recordBlock(r.section) +
    '<div class="note warn undecided-note' + (undecided ? '' : ' hidden') + '">запись не решена — ответ уйдёт в замечания; выбери вариант в карточке</div>' +
    '<div class="note bad conflict-note' + (conflict ? '' : ' hidden') + '">конфликт ответов к одному решению — оставь один, иначе слово к решению не уйдёт в промпт</div>' +
    '<div class="row"><textarea data-att="' + ai + '" data-row="' + ri + '" placeholder="спор: почему опора есть / почему не блокер — уйдёт в промпт возврата; при закрытии «вопрос человеку» и разделе F-NN, decision — слово к решению">' + esc(attackState.disputes[key] || '') + '</textarea></div></div>';
}
function currentFlags() { return buildPrompt(JOURNAL, ATTACK, state, attackState.disputes, ''); }
/* страница подсвечивает конфликт ответов у строк, не пересобирая список: поле спора не теряет фокус */
function markConflicts() {
  if (mode !== 'attack') return;
  const flags = currentFlags(), bad = new Set(flags.conflictKeys), und = new Set(flags.undecidedKeys);
  document.querySelectorAll('#viewAttack .attackrow').forEach(c => {
    const [ai, ri] = String(c.dataset.card).split('|').map(Number), att = ATTACK[ai], r = att && att.rows[ri];
    const on = !!r && bad.has(disputeKey(att, r));
    c.classList.toggle('conflict', on);
    const n = c.querySelector('.conflict-note'); if (n) n.classList.toggle('hidden', !on);
    const u = c.querySelector('.undecided-note'); if (u) u.classList.toggle('hidden', !(r && und.has(disputeKey(att, r))));
  });
}
function renderAttack() {
  const el = document.getElementById('viewAttack');
  if (!ATTACK.length) { el.innerHTML = '<div class="card"><div class="q">атака не подана: <code>render-html --attack &lt;attack/decisions.md&gt; [--attack &lt;attack/artifacts.md&gt;]</code></div></div>'; return; }
  const flags = currentFlags(), bad = new Set(flags.conflictKeys), und = new Set(flags.undecidedKeys);
  /* группы по файлам: линзы списка файла в его порядке, затем «вне списка» */
  const files = ATTACK.map((att, ai) => {
    const rows = att.rows || [], list = lensList(att), slugs = list.map(l => l.slug);
    const indexed = rows.map((r, ri) => ({ r, ri }));
    const groups = list.map(l => ({ slug:l.slug, rows:indexed.filter(x => x.r.lens === l.slug) })).filter(g => g.rows.length);
    const outside = indexed.filter(x => !slugs.includes(x.r.lens));
    if (outside.length) groups.push({ slug:OUTSIDE, rows:outside });
    return { att, ai, rows, groups, outside };
  });
  const available = [], count = {};
  for (const f of files) for (const g of f.groups) { if (!available.includes(g.slug)) available.push(g.slug); count[g.slug] = (count[g.slug] || 0) + g.rows.length; }
  if (attackLens !== 'all' && !available.includes(attackLens)) attackLens = 'all';
  const total = files.reduce((n, f) => n + f.rows.length, 0);
  let html = '<div class="note info">' + esc(ATTACK_HINT) + '</div>' +
    '<div class="row lensfilter" id="lensFilter"><b style="flex:0 0 auto">линза:</b>' +
    '<button class="small' + (attackLens === 'all' ? ' active' : '') + '" data-lens="all">все · ' + total + '</button>' +
    available.map(slug => '<button class="small' + (attackLens === slug ? ' active' : '') + '" data-lens="' + esc(slug) + '">' +
      (slug === OUTSIDE ? 'вне списка' : esc(slug)) + ' · ' + count[slug] + '</button>').join('') + '</div>';
  for (const f of files) {
    const { att, ai, rows, groups, outside } = f, fm = att.frontmatter || {};
    const sev = SEVERITY.map(s => rows.filter(r => sevBase(r.severity) === s).length);
    const otherSev = rows.filter(r => !SEVERITY.includes(sevBase(r.severity))).length;
    /* счётчики тяжести — по всему файлу, в шапке файла, вне контейнера строк: фильтр их не трогает (F-56.E) */
    html += '<div class="card"><div class="head"><span class="id mono">' + esc(att.path) + '</span><span class="badge ' + (fm.status === 'passed' ? 'ok' : 'park') + '">status: ' + esc(fm.status || '—') + '</span>' + verdictNote(att) +
      '<span class="badge">' + (attackKind(att) === 'journal' ? 'линзы журнала' : 'линзы артефактов') + '</span></div>' +
      '<div class="meta">цели: ' + (fm.targets || []).map(t => '<span class="chip">' + esc(t.path) + ' ' + shaChip(t.sha256, 'без хеша') + '</span>').join('') + '</div>' +
      '<div class="counters sevcounters">по тяжести, весь файл: блокеров <b>' + sev[0] + '</b> · предупреждений <b>' + sev[1] + '</b> · справок <b>' + sev[2] + '</b>' +
      (otherSev ? ' · прочих <b>' + otherSev + '</b>' : '') + '</div>' +
      '<div class="counters">по линзе: ' + groups.filter(g => g.slug !== OUTSIDE).map(g => '<code>' + esc(g.slug) + '</code> <b>' + g.rows.length + '</b>').join(' · ') +
      (outside.length ? ' · строк вне списка (невалидны, в счётчике линз их нет): <b>' + outside.length + '</b>' : '') + '</div></div>';
    html += '<div class="attack-rows">';
    const shown = groups.filter(g => attackLens === 'all' || g.slug === attackLens);
    if (!shown.length) html += '<div class="meta">по фильтру в этом файле строк нет</div>';
    for (const g of shown) {
      html += '<h2>' + (g.slug === OUTSIDE ? 'вне списка — слуг не из закрытого списка линз файла' : '<code>' + esc(g.slug) + '</code> · ' + esc(lensLabel(att, g.slug))) + ' · ' + g.rows.length + '</h2>';
      const sevs = SEVERITY.concat([...new Set(g.rows.map(x => sevBase(x.r.severity)))].filter(s => !SEVERITY.includes(s)));
      for (const sv of sevs) {
        const part = g.rows.filter(x => sevBase(x.r.severity) === sv);
        if (part.length) html += '<h3>' + esc(sv) + ' · ' + part.length + '</h3>' + part.map(x => attackRow(att, ai, x.ri, x.r, bad.has(disputeKey(att, x.r)), und.has(disputeKey(att, x.r)))).join('');
      }
    }
    html += '</div><!' + '--/attack-rows-->';
  }
  el.innerHTML = html;
  el.querySelectorAll('button[data-lens]').forEach(b => b.onclick = () => { attackLens = b.dataset.lens; try { localStorage.setItem(KEY + ':lens', attackLens); } catch (e) {} renderAttack(); });
  el.querySelectorAll('textarea[data-att]').forEach(t => t.oninput = () => {
    const att = ATTACK[+t.dataset.att], r = att.rows[+t.dataset.row], k = disputeKey(att, r);
    if (t.value.trim()) attackState.disputes[k] = t.value; else delete attackState.disputes[k]; saveAttack(); updateOut();
  });
  el.querySelectorAll('a[data-goto]').forEach(a => a.onclick = e => { e.preventDefault(); setMode('decisions'); const c = document.getElementById(a.dataset.goto); if (c && c.scrollIntoView) c.scrollIntoView(); });
}

function render() { renderModes(); renderSchemePanel(); document.getElementById('btnOpen').classList.toggle('active', filter.openOnly); renderCards(); renderNewForks(); renderToc(); renderStats(); headerHeight(); if (mode === 'check') renderCheck(); if (mode === 'attack') renderAttack(); updateOut(); }

document.getElementById('notes').value = state.notes || '';
document.getElementById('notes').oninput = e => { state.notes = e.target.value; save(); updateOut(); };
document.getElementById('btnAll').onclick = () => { filter = { openOnly:false }; render(); };
document.getElementById('btnOpen').onclick = () => { filter.openOnly = !filter.openOnly; render(); };
document.getElementById('btnScheme').onclick = () => { schemeOn = !schemeOn; try { localStorage.setItem(KEY + ':scheme', schemeOn ? '1' : '0'); } catch (e) {} renderSchemePanel(); };
document.getElementById('btnToggleNew').onclick = () => document.getElementById('newForkForm').classList.toggle('hidden');
document.getElementById('btnAddFork').onclick = () => {
  const q = document.getElementById('nfQuestion').value.trim(); if (!q) return;
  state.newForks.push({ id: 'F-N' + (state.newForks.length + 1), question: q, options: document.getElementById('nfOptions').value.trim(), word: document.getElementById('nfWord').value.trim() });
  ['nfQuestion','nfOptions','nfWord'].forEach(i => document.getElementById(i).value = ''); save(); render();
};
document.getElementById('btnCopy').onclick = async () => {
  const t = document.getElementById('out'); let ok = false;
  try { await navigator.clipboard.writeText(t.value); ok = true; } catch (e) { t.select(); ok = document.execCommand('copy'); }
  const c = document.getElementById('copied'); c.textContent = ok ? 'скопировано' : 'не удалось — выдели и скопируй руками'; setTimeout(() => c.textContent = '', 2000);
};
document.getElementById('btnExport').onclick = () => {
  const blob = new Blob([JSON.stringify(state, null, 1)], { type:'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'symphysis-decisions.json'; a.click();
};
document.getElementById('btnImport').onclick = () => document.getElementById('fileImport').click();
document.getElementById('fileImport').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  f.text().then(txt => { try { state = Object.assign(EMPTY(), JSON.parse(txt)); save(); render(); document.getElementById('notes').value = state.notes || ''; } catch (err) { alert('не JSON состояния'); } });
};
document.getElementById('btnReset').onclick = () => { if (confirm('Стереть все решения и споры из браузера? Решения, уже внесённые в журнал, останутся.')) { state = EMPTY(); save(); attackState = { disputes:{} }; saveAttack(); document.getElementById('notes').value = ''; render(); } };
document.getElementById('title').textContent = JOURNAL.title || document.title;
render();
</script>
</body>
</html>
