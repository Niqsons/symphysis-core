schema: symphysis
rules:
  decisions:
    - у каждого варианта улика — путь и цитата
    - маловероятный вариант показывается с причиной
    - адресат парковки — материалы, человек, ИБ
  proposal:
    - "утверждение о механике, цели или ограничении без записи F-NN — предположение: сначала запись в журнал (развилка с рекомендацией), потом артефакт"
  specs:
    - предположение помечается словом `предположение` и дорогой `проверить|решить`
    - у каждого требования хотя бы один сценарий GIVEN/WHEN/THEN
    - след проб — комментарии «проба краёв» и «проба запретов» — в общую спеку при синхронизации не переносится
    - "ссылки на записи этого изменения в общей спеке стоят в форме якоря `<изменение>/F-NN`; форму даёт скрипт `python .symphysis/tools/anchor_refs.py <имя>` после переноса блоков, его вывод показывается человеку; руками ссылки не переписываются"
  design:
    - решение излагается, не принимается
    - "утверждение о механике, цели или ограничении без записи F-NN — предположение: сначала запись в журнал (развилка с рекомендацией), потом артефакт"
  attack-decisions:
    - "FORCE stance: считай каждое утверждение неподкреплённым, пока улика не доказала обратное"
  attack-artifacts:
    - "FORCE stance: считай каждое утверждение неподкреплённым, пока улика не доказала обратное"
  security:
    - канон не чеканится в журнал
  tasks:
    - "утверждение о механике, цели или ограничении без записи F-NN — предположение: сначала запись в журнал (развилка с рекомендацией), потом артефакт"

# Подсказки операций: список строк (project-config.ts: z.array(z.string())), CLI отдаёт их полем operationGuidance.
operations:
  archive:
    guidance:
      - "до выбора синхронизации вызови `python .symphysis/tools/trace_graph.py freeze <имя>`; если вывод начинается с «Граф собран заново», отдай человеку ссылку на `graph/report.md` из вывода, без пересказа и без отбора строк; при «Снимок свежий: обновлены только коммиты» ссылку не отдавай"
      - "ошибку скрипта графа назови человеку и архивацию не останавливай: правило «не сообщать об ошибке» относится к получению подсказок, не к скрипту"
      - "после синхронизации и до переноса каталога в архив вызови `python .symphysis/tools/anchor_refs.py <имя>`: голые номера журнала в блоках изменения получают якорь `<имя>/F-NN`, вывод отдай человеку как есть; CLI `openspec archive` к общей спеке с якорями не применяй — каталог переносит скилл"

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
