schema: symphysis
rules:
  decisions:
    - у каждого варианта улика — путь и цитата
    - маловероятный вариант показывается с причиной
    - адресат парковки — материалы, человек, ИБ
  proposal:
    - "утверждение о механике, цели или ограничении без записи F-NN — предположение: сначала запись в журнал (развилка с рекомендацией), потом артефакт"
  specs:
    - предположение помечается словом `предположение` и дорогой `проверить|решить`
    - у каждого требования хотя бы один сценарий GIVEN/WHEN/THEN
  design:
    - решение излагается, не принимается
    - "утверждение о механике, цели или ограничении без записи F-NN — предположение: сначала запись в журнал (развилка с рекомендацией), потом артефакт"
  attack-decisions:
    - "FORCE stance: считай каждое утверждение неподкреплённым, пока улика не доказала обратное"
  attack-artifacts:
    - "FORCE stance: считай каждое утверждение неподкреплённым, пока улика не доказала обратное"
  security:
    - канон не чеканится в журнал
  tasks:
    - "утверждение о механике, цели или ограничении без записи F-NN — предположение: сначала запись в журнал (развилка с рекомендацией), потом артефакт"

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
